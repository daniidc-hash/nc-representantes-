<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC | Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#152238; --navy-2:#1e3050;
    --cream:#F5EFE4; --cream-2:#EDE4D3;
    --bordeaux:#7A2E3A; --bordeaux-2:#5E212B;
    --gold:#C9A227; --ink:#2B2420; --muted:#8A8072;
    --danger:#B23A3A; --ok:#4C7A4C; --warn:#B8862C;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Georgia','Times New Roman',serif; background:var(--navy); color:var(--ink); min-height:100vh;}

  #tela-login{min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%, var(--navy-2), var(--navy) 70%);}
  .caixa-login{background:var(--cream); padding:44px 36px; border-radius:6px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.35); text-align:center;}
  .marca-nc{display:inline-block; background:var(--bordeaux); color:var(--cream); font-weight:bold;
    letter-spacing:2px; padding:6px 18px; border-radius:4px; font-size:14px; margin-bottom:18px;}
  .caixa-login h1{font-size:20px; margin:0 0 6px;}
  .caixa-login p.sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  input, select, textarea{font-family:'Georgia',serif; padding:10px 11px; border:1px solid #D8CDB8;
    border-radius:4px; background:#fff; color:var(--ink); font-size:14px;}
  input[type="text"], input[type="password"], input[type="date"], input[type="number"]{width:100%;}
  textarea{resize:vertical; min-height:70px; line-height:1.5; width:100%;}
  .btn{display:inline-block; background:var(--bordeaux); color:var(--cream); border:none; padding:10px 18px;
    border-radius:4px; font-family:'Georgia',serif; font-size:13.5px; cursor:pointer;}
  .btn:hover{background:var(--bordeaux-2);}
  .btn-ghost{background:transparent; color:var(--bordeaux); border:1px solid var(--bordeaux);}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  #login-erro{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}
  .campo-login{margin-bottom:12px; text-align:left;}
  .campo-login label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  #tela-login .btn{width:100%; margin-top:6px;}

  #app{display:none;}
  header.topo{background:var(--navy); color:var(--cream); padding:16px 24px; display:flex;
    align-items:center; justify-content:space-between; border-bottom:3px solid var(--gold);
    position:sticky; top:0; z-index:20;}
  header.topo h1{font-size:18px; margin:0; font-weight:normal;}
  header.topo .voltar{color:var(--cream); text-decoration:none; font-size:13px;
    border:1px solid rgba(245,239,228,.4); padding:6px 12px; border-radius:4px;}
  header.topo .voltar:hover{background:rgba(245,239,228,.1);}
  #quem-lancou{font-size:12px; opacity:.8;}

  .layout{display:flex; min-height:calc(100vh - 60px);}
  nav.sidebar{width:220px; background:var(--cream-2); padding:18px 0; flex-shrink:0; border-right:1px solid #DED2B8;}
  nav.sidebar button.item{display:block; width:100%; text-align:left; background:none; border:none;
    padding:11px 20px; font-family:'Georgia',serif; font-size:14px; color:var(--ink); cursor:pointer;
    border-left:3px solid transparent;}
  nav.sidebar button.item:hover{background:#E4D9C1;}
  nav.sidebar button.item.ativo{background:#fff; border-left:3px solid var(--bordeaux); color:var(--bordeaux); font-weight:bold;}

  main.conteudo{flex:1; padding:26px 30px; background:#FBF8F2; overflow-x:auto;}
  .secao{display:none;}
  .secao.ativa{display:block;}
  .secao h2{font-size:22px; margin:0 0 4px; color:var(--navy);}
  .secao .desc{color:var(--muted); font-size:13.5px; margin:0 0 20px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:24px;}
  .kpi{background:#fff; border:1px solid #E7DFCC; border-radius:6px; padding:16px 18px;}
  .kpi .label{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .kpi .valor{font-size:22px; font-weight:bold; color:var(--navy); margin-top:4px;}
  .kpi.pos .valor{color:var(--ok);}
  .kpi.neg .valor{color:var(--danger);}
  .kpi.alerta .valor{color:var(--warn);}

  .cartao{background:#fff; border:1px solid #E7DFCC; border-radius:6px; padding:18px; margin-bottom:18px;}
  .cartao h3{margin:0 0 10px; font-size:15px; color:var(--bordeaux);}

  .filtros{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:end;}
  .filtros .campo-f{display:flex; flex-direction:column; gap:4px;}
  .filtros .campo-f label{font-size:11.5px; color:var(--muted); text-transform:uppercase;}
  .filtros input, .filtros select{font-size:13px; padding:7px 9px;}

  table.dyn{width:100%; border-collapse:collapse; font-size:13px;}
  table.dyn th{text-align:left; font-size:11.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.3px; padding:8px; border-bottom:2px solid #E7DFCC; white-space:nowrap;}
  table.dyn td{padding:7px 8px; border-bottom:1px solid #F0EAD9; vertical-align:middle;}
  table.dyn tr:hover td{background:#FBF6EA;}
  .linha-dre-clicavel{cursor:pointer;}
  .linha-dre-clicavel:hover td{background:#F3E9D2 !important;}
  .badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:bold;}
  .badge-pago{background:#E4F0E4; color:var(--ok);}
  .badge-pendente{background:#FBF0DC; color:var(--warn);}
  .badge-atrasado{background:#F7E1E1; color:var(--danger);}
  .link-remover{color:var(--danger); cursor:pointer; font-size:16px;}
  .link-marcar{color:var(--ok); cursor:pointer; font-size:12.5px; text-decoration:underline;}

  .form-linha{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:12px;}
  .form-linha .campo label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; text-transform:uppercase;}

  .msg{font-size:12.5px; margin-left:10px; opacity:0; transition:opacity .2s;}
  .msg.ver{opacity:1;}
  .msg.ok{color:var(--ok);} .msg.erro{color:var(--danger);}

  .conciliacao-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .conciliacao-col h4{margin:0 0 8px; font-size:13.5px; color:var(--navy);}
  .item-extrato{background:#fff; border:1px solid #E7DFCC; border-radius:5px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
  .item-extrato .sugestao{font-size:12px; color:var(--ok); margin-top:6px;}
  .tag-tipo{font-size:11px; padding:2px 7px; border-radius:3px; font-weight:bold; margin-left:6px;}
  .tag-entrada{background:#E4F0E4; color:var(--ok);}
  .tag-saida{background:#F7E1E1; color:var(--danger);}

  @media (max-width:760px){
    .layout{flex-direction:column;}
    nav.sidebar{width:100%; display:flex; overflow-x:auto; padding:8px;}
    nav.sidebar button.item{white-space:nowrap; border-left:none; border-bottom:3px solid transparent;}
    nav.sidebar button.item.ativo{border-left:none; border-bottom:3px solid var(--bordeaux);}
    main.conteudo{padding:18px 14px;}
    .conciliacao-col{grid-template-columns:1fr;}
  }
  .btn-exportar-pdf{background:var(--gold); color:var(--ink); border:none; padding:8px 16px; border-radius:4px; font-family:'Georgia',serif; font-size:13px; cursor:pointer; margin-bottom:16px;}
  .btn-exportar-pdf:hover{background:#B8931F;}

  @media print{
    nav.sidebar, header.topo, .btn, .btn-sm, .btn-ghost, .filtros, .form-linha, .btn-exportar-pdf, #status-save { display:none !important; }
    main.conteudo{padding:0 !important;}
    body{background:#fff !important;}
    .secao.ativa{max-width:none !important;}
    .cartao{box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid;}
    table.dyn{font-size:11px;}
  }
</style>
</head>
<body>

<div id="tela-login">
  <div class="caixa-login">
    <span class="marca-nc">NC</span>
    <h1>Financeiro</h1>
    <p class="sub">Verificando seu acesso...</p>
    <div id="login-erro"></div>
    <a href="hub.html" class="btn" style="text-decoration:none; display:inline-block;">Ir para o Portal</a>
  </div>
</div>

<div id="app">
  <header class="topo">
    <h1>NC · Financeiro</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="quem-lancou"></span>
      <a class="voltar" href="hub.html">← Portal</a>
      <a class="voltar" href="index.html">Sistema</a>
      <a class="voltar" href="planejamento.html">Planejamento</a>
      <button class="voltar" style="cursor:pointer;" onclick="sairDoModulo()">Sair</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="nav-sidebar"></nav>
    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<script>
/* ================= CONFIG SUPABASE ================= */
const SUPABASE_URL = "https://wnnpmbgytuxyzonkmlyp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wlkj9arKt8rtySgbwEtIxw_ETQCi-Ta";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Login agora é feito pelo Portal (hub.html), usando Supabase Auth de verdade. */

const PERMISSOES_POR_ROLE = {
  gestora:        { sistema:true,  financeiro:true,  planejamento:true },
  financeiro:     { sistema:false, financeiro:true,  planejamento:false },
  vendedor:       { sistema:true,  financeiro:false, planejamento:false },
  representante:  { sistema:true,  financeiro:false, planejamento:false },
};

let usuarioAtual = "";

async function checarAcessoEIniciar(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href = 'hub.html';
    return;
  }
  const { data: perfil, error } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !perfil){
    document.getElementById('login-erro').textContent = 'Não encontramos seu perfil. Fale com a gestão.';
    return;
  }
  const permissoes = PERMISSOES_POR_ROLE[perfil.role] || {};
  if(!permissoes.financeiro){
    document.getElementById('login-erro').textContent = 'Seu perfil não tem acesso ao Financeiro.';
    return;
  }
  usuarioAtual = perfil.nome || perfil.email;
  iniciarApp();
}

window.addEventListener('DOMContentLoaded', checarAcessoEIniciar);

async function sairDoModulo(){
  await supabaseClient.auth.signOut();
  window.location.href = 'hub.html';
}

/* ================= DADOS EM MEMÓRIA ================= */
let contasPagar = [];
let contasReceber = [];
let extrato = [];
let saldoInicial = 0;

const ABAS = [
  {id:"resumo", titulo:"Resumo"},
  {id:"pagar", titulo:"Contas a Pagar"},
  {id:"receber", titulo:"Contas a Receber"},
  {id:"bancos", titulo:"Contas Bancárias"},
  {id:"relatorio_receber", titulo:"Relatório · A Receber"},
  {id:"relatorio_pagar", titulo:"Relatório · A Pagar"},
  {id:"fluxo", titulo:"Fluxo de Caixa"},
  {id:"semanal", titulo:"Planejamento Semanal"},
  {id:"conciliacao", titulo:"Conciliação Bancária"},
  {id:"dre", titulo:"DRE Gerencial"},
  {id:"orcado_realizado", titulo:"Orçado x Realizado"},
];

const GRUPOS_DRE = ["Receita","Dedução de Receita","Custo Variável","Custo Fixo","Despesa Operacional","Despesa Financeira","Investimento","Outro"];
let abaAtiva = "resumo";

const filtrosRelatorio = {
  receber: {representante:'', regiao:'', pais:'', forma:'', status:'', usarSemana:false, semanaRef: hojeISOsafe()},
  pagar:   {fornecedor:'', categoria:'', forma:'', status:'', banco:'', situacao:'', usarSemana:false, semanaRef: hojeISOsafe()},
};
function hojeISOsafe(){ return new Date().toISOString().slice(0,10); }

let filtroSemanal = { semanaRef: hojeISOsafe(), modo: 'ambos' };
let filtroFluxo = { modo: 'ambos', conta: 'todas', dataInicio: '', dataFim: '' };

async function iniciarApp(){
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('quem-lancou').textContent = "Logado como " + usuarioAtual;
  montarSidebar();
  await carregarTudo();
  renderAba(abaAtiva);
}

function montarSidebar(){
  const nav = document.getElementById('nav-sidebar');
  nav.innerHTML = '';
  ABAS.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'item' + (a.id===abaAtiva ? ' ativo':'');
    b.textContent = a.titulo;
    b.onclick = ()=>{ abaAtiva = a.id; montarSidebar(); renderAba(a.id); };
    nav.appendChild(b);
  });
}

let orcamentoContas = []; // vem do módulo Planejamento (tabela planejamento, secao='orcamento')
let bancos = [];
let representantesLista = [];

const REGIOES_BR = ["Norte","Nordeste","Centro-Oeste","Sudeste","Sul"];
const FORMAS_PAGAMENTO = ["Pix","Boleto","Transferência (TED/DOC)","Cartão de crédito","Cartão de débito","Dinheiro","Cheque","Outro"];

async function carregarTudo(){
  const [p, r, e, cfg, orc, bcs, reps] = await Promise.all([
    supabaseClient.from('contas_pagar').select('*').order('vencimento', {ascending:true}),
    supabaseClient.from('contas_receber').select('*').order('vencimento', {ascending:true}),
    supabaseClient.from('extrato_bancario').select('*').order('data', {ascending:true}),
    supabaseClient.from('financeiro_config').select('*').eq('chave','saldo_inicial').maybeSingle(),
    supabaseClient.from('planejamento').select('dados').eq('secao','orcamento').maybeSingle(),
    supabaseClient.from('bancos').select('*').order('nome', {ascending:true}),
    supabaseClient.from('reps').select('nome').order('nome', {ascending:true}),
  ]);
  contasPagar = p.data || [];
  contasReceber = r.data || [];
  extrato = e.data || [];
  saldoInicial = (cfg.data && cfg.data.valor && cfg.data.valor.valor) ? Number(cfg.data.valor.valor) : 0;
  orcamentoContas = (orc.data && orc.data.dados && orc.data.dados.contas) ? orc.data.dados.contas : [];
  bancos = bcs.data || [];
  representantesLista = (reps.data || []).map(r=>r.nome).filter(Boolean);
}

async function adicionarBancoRapido(){
  const nome = prompt('Nome do banco/conta:');
  if(!nome) return;
  await supabaseClient.from('bancos').insert({nome});
  await carregarTudo();
  renderAba('pagar');
}

/* ================= CONTAS BANCÁRIAS (cadastro) ================= */
function viewBancos(){
  const linhas = bancos.map(b=>`
    <tr>
      <td><input type="text" id="nome-banco-${b.id}" value="${escapeHtml(b.nome)}"></td>
      <td><input type="number" step="0.01" id="saldo-banco-${b.id}" value="${b.saldo_inicial||0}" style="width:130px;"></td>
      <td>${b.criado_em ? new Date(b.criado_em).toLocaleDateString('pt-BR') : ''}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="renomearBanco('${b.id}')">Salvar</button>
        <span class="link-remover" onclick="removerBanco('${b.id}')" title="Remover">✕</span>
        <span class="msg" id="msg-banco-${b.id}"></span>
      </td>
    </tr>
  `).join('');

  return `<div class="secao ativa">
    <h2>Contas Bancárias</h2>
    <p class="desc">Cadastre aqui as contas (ex: Conta Ailos, Conta Itaú, Caixinha, Caixa Cartão Crédito) e o saldo inicial de cada uma — usado no Fluxo de Caixa e na Conciliação Bancária.</p>

    <div class="cartao">
      <h3>Nova conta</h3>
      <div class="form-linha">
        <div class="campo"><label>Nome da conta</label><input type="text" id="novo-banco-nome" placeholder="Ex: Conta Itaú"></div>
        <div class="campo"><label>Saldo inicial</label><input type="number" step="0.01" id="novo-banco-saldo" value="0"></div>
        <div class="campo" style="align-self:end;"><button class="btn btn-sm" onclick="adicionarBancoCadastro()">Adicionar</button></div>
      </div>
      <span class="msg" id="msg-novo-banco"></span>
    </div>

    <div class="cartao">
      <h3>Contas cadastradas (${bancos.length})</h3>
      <table class="dyn">
        <thead><tr><th>Nome</th><th>Saldo inicial</th><th>Cadastrada em</th><th></th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="4" style="color:var(--muted); padding:14px 8px;">Nenhuma conta cadastrada ainda.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

async function adicionarBancoCadastro(){
  const nome = document.getElementById('novo-banco-nome').value.trim();
  const saldo = parseFloat(document.getElementById('novo-banco-saldo').value) || 0;
  const msg = document.getElementById('msg-novo-banco');
  if(!nome){ msg.textContent = 'Digite um nome.'; msg.className = 'msg erro'; return; }
  const { error } = await supabaseClient.from('bancos').insert({ nome, saldo_inicial: saldo });
  if(error){ msg.textContent = 'Erro ao salvar.'; msg.className = 'msg erro'; console.error(error); return; }
  document.getElementById('novo-banco-nome').value = '';
  document.getElementById('novo-banco-saldo').value = '0';
  msg.textContent = 'Adicionada ✓'; msg.className = 'msg ok';
  await carregarTudo();
  renderAba('bancos');
}

async function renomearBanco(id){
  const novoNome = document.getElementById(`nome-banco-${id}`).value.trim();
  const novoSaldo = parseFloat(document.getElementById(`saldo-banco-${id}`).value) || 0;
  const msg = document.getElementById(`msg-banco-${id}`);
  if(!novoNome){ msg.textContent = 'Nome vazio.'; msg.className = 'msg erro'; return; }
  const { error } = await supabaseClient.from('bancos').update({ nome: novoNome, saldo_inicial: novoSaldo }).eq('id', id);
  if(error){ msg.textContent = 'Erro'; msg.className = 'msg erro'; console.error(error); return; }
  msg.textContent = 'Salvo ✓'; msg.className = 'msg ok';
  await carregarTudo();
}

async function removerBanco(id){
  if(!confirm('Remover essa conta bancária? Lançamentos já feitos com ela continuam guardando o nome, só some da lista de seleção.')) return;
  await supabaseClient.from('bancos').delete().eq('id', id);
  await carregarTudo();
  renderAba('bancos');
}

/* ---- Semana (segunda a domingo) ---- */
function inicioDaSemana(dataISO){
  const d = new Date(dataISO + 'T00:00:00');
  const diaSemana = d.getDay(); // 0=domingo...6=sábado
  const deslocamento = diaSemana === 0 ? -6 : 1 - diaSemana; // volta até a segunda
  d.setDate(d.getDate() + deslocamento);
  return d;
}
function formatarISO(d){ return d.toISOString().slice(0,10); }
function rangeSemana(dataISO){
  const seg = inicioDaSemana(dataISO);
  const dom = new Date(seg); dom.setDate(dom.getDate()+6);
  return { inicio: formatarISO(seg), fim: formatarISO(dom) };
}
function formatarDataBR(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

/* ================= UTIL ================= */
function moeda(v){
  return (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function botaoExportarPDF(){
  return `<button class="btn-exportar-pdf" onclick="window.print()">⬇ Exportar PDF</button>`;
}

function statusConta(conta, tipo){
  const pago = tipo==='pagar' ? conta.data_pagamento : conta.data_recebimento;
  if(pago) return tipo==='pagar' ? 'Pago' : 'Recebido';
  if(conta.vencimento && conta.vencimento < hojeISO()) return 'Atrasado';
  return 'Pendente';
}
function badgeStatus(status){
  const cls = status==='Pago'||status==='Recebido' ? 'badge-pago' : (status==='Atrasado' ? 'badge-atrasado' : 'badge-pendente');
  return `<span class="badge ${cls}">${status}</span>`;
}

/* ================= RENDER PRINCIPAL ================= */
function renderAba(id){
  const cont = document.getElementById('conteudo');
  if(id==='resumo') cont.innerHTML = viewResumo();
  else if(id==='pagar') cont.innerHTML = viewContas('pagar');
  else if(id==='receber') cont.innerHTML = viewContas('receber');
  else if(id==='bancos') cont.innerHTML = viewBancos();
  else if(id==='fluxo') cont.innerHTML = viewFluxo();
  else if(id==='semanal') cont.innerHTML = viewSemanal();
  else if(id==='conciliacao') cont.innerHTML = viewConciliacao();
  else if(id==='relatorio_receber') cont.innerHTML = viewRelatorio('receber');
  else if(id==='relatorio_pagar') cont.innerHTML = viewRelatorio('pagar');
  else if(id==='dre') cont.innerHTML = viewDRE();
  else if(id==='orcado_realizado') cont.innerHTML = viewOrcadoRealizado();
  ativarHandlers(id);
}

/* ================= RESUMO ================= */
function viewResumo(){
  const em30 = new Date(); em30.setDate(em30.getDate()+30);
  const em30ISO = em30.toISOString().slice(0,10);

  const totalPagarAberto = contasPagar.filter(c=>!c.data_pagamento).reduce((s,c)=>s+Number(c.valor),0);
  const totalReceberAberto = contasReceber.filter(c=>!c.data_recebimento).reduce((s,c)=>s+Number(c.valor),0);
  const atrasadasPagar = contasPagar.filter(c=>!c.data_pagamento && c.vencimento < hojeISO()).length;
  const atrasadasReceber = contasReceber.filter(c=>!c.data_recebimento && c.vencimento < hojeISO()).length;
  const pagarProx30 = contasPagar.filter(c=>!c.data_pagamento && c.vencimento>=hojeISO() && c.vencimento<=em30ISO).reduce((s,c)=>s+Number(c.valor),0);
  const receberProx30 = contasReceber.filter(c=>!c.data_recebimento && c.vencimento>=hojeISO() && c.vencimento<=em30ISO).reduce((s,c)=>s+Number(c.valor),0);
  const naoConciliados = extrato.filter(e=>!e.conciliado).length;
  const totalSaldoInicialContas = bancos.reduce((s,b)=>s+Number(b.saldo_inicial||0),0);

  return `<div class="secao ativa">
    <h2>Resumo Financeiro</h2>
    <p class="desc">Visão geral de contas a pagar, a receber e conciliação.</p>
    ${botaoExportarPDF()}
    <div class="kpis">
      <div class="kpi"><div class="label">Saldo inicial (todas as contas)</div><div class="valor">${moeda(totalSaldoInicialContas)}</div></div>
      <div class="kpi neg"><div class="label">A pagar em aberto</div><div class="valor">${moeda(totalPagarAberto)}</div></div>
      <div class="kpi pos"><div class="label">A receber em aberto</div><div class="valor">${moeda(totalReceberAberto)}</div></div>
      <div class="kpi ${atrasadasPagar+atrasadasReceber>0?'alerta':''}"><div class="label">Contas atrasadas</div><div class="valor">${atrasadasPagar+atrasadasReceber}</div></div>
      <div class="kpi"><div class="label">A pagar próx. 30 dias</div><div class="valor">${moeda(pagarProx30)}</div></div>
      <div class="kpi"><div class="label">A receber próx. 30 dias</div><div class="valor">${moeda(receberProx30)}</div></div>
      <div class="kpi ${naoConciliados>0?'alerta':''}"><div class="label">Extrato não conciliado</div><div class="valor">${naoConciliados} itens</div></div>
    </div>
    <p style="color:var(--muted); font-size:13px;">O saldo inicial de cada conta é definido na aba <b>Contas Bancárias</b>.</p>
  </div>`;
}

/* ================= CONTAS A PAGAR / RECEBER ================= */

      <td>${escapeHtml(c.regiao||'')}</td>
      <td>${escapeHtml(c.pais||'')}</td>
      <td>${escapeHtml(c.banco||'')}</td>` : `

      <td><span class="link-marcar" onclick="alternarConfirmado('${c.id}', ${!c.confirmado})">${c.confirmado ? '<span class="badge badge-pago">Confirmado</span>' : '<span class="badge badge-pendente">Previsto</span>'}</span></td>
      <td>${escapeHtml(c.plano_conta_nome||'—')}</td>`;
    const celDocumentos = tipo==='pagar' ? `<td>${celulaDocumentos(c)}</td>` : '';
    return `<tr>
      <td>${escapeHtml(c[campoParte]||'')}</td>
      <td>${escapeHtml(c.descricao||'')} ${automatico ? '<span class="badge badge-pendente" title="Gerado automaticamente pela emissão da nota fiscal">Auto (NF)</span>' : ''}
        ${c.origem && c.origem!=='Manual' ? `<span class="badge badge-pago" title="Origem do lançamento">${escapeHtml(c.origem)}</span>` : ''}</td>
      <td>${escapeHtml(c.categoria||'')}</td>
      <td>${escapeHtml(c.grupo_dre||'')}</td>
      <td>${moeda(c.valor)}</td>
      <td>${c.vencimento||''}</td>
      <td>${c[campoData]||'—'}</td>
      <td>${badgeStatus(status)}</td>${extrasCel}
      <td>${escapeHtml(c.lancado_por||'')}</td>
      ${celDocumentos}
      <td>
        ${!c[campoData] ? `<span class="link-marcar" onclick="marcarComoQuitado('${tipo}','${c.id}')">Marcar ${tipo==='pagar'?'pago':'recebido'}</span>` : ''}
        <span class="link-remover" onclick="removerConta('${tipo}','${c.id}')" title="Remover">✕</span>
      </td>

  }).join('');

  const camposExtrasForm = tipo==='receber' ? `
        <div class="campo"><label>Nº Nota Fiscal</label><input type="text" id="novo-${tipo}-nf"></div>
        <div class="campo"><label>Parcela/Documento</label><input type="text" id="novo-${tipo}-parcela" placeholder="Ex: 1/3"></div>
        <div class="campo"><label>Representante</label>
          <select id="novo-${tipo}-representante">
            <option value="">— selecione —</option>
            ${representantesLista.map(nome=>`<option value="${escapeHtml(nome)}">${escapeHtml(nome)}</option>`).join('')}
          </select>
        </div>
        <div class="campo"><label>Região</label>
          <select id="novo-${tipo}-regiao">
            <option value="">— selecione —</option>
            ${REGIOES_BR.map(r=>`<option value="${r}">${r}</option>`).join('')}
          </select>
        </div>
        <div class="campo"><label>País</label><input type="text" id="novo-${tipo}-pais" value="Brasil"></div>
        <div class="campo"><label>Banco</label>
          <select id="novo-${tipo}-banco">
            <option value="">— selecione —</option>
            ${bancos.map(b=>`<option value="${escapeHtml(b.nome)}">${escapeHtml(b.nome)}</option>`).join('')}
          </select>
        </div>` : `
        <div class="campo"><label>Nº NF do fornecedor</label><input type="text" id="novo-${tipo}-nf-fornecedor"></div>
        <div class="campo"><label>Banco</label>
          <div style="display:flex; gap:6px;">
            <select id="novo-${tipo}-banco" style="flex:1;">
              <option value="">— selecione —</option>
              ${bancos.map(b=>`<option value="${escapeHtml(b.nome)}">${escapeHtml(b.nome)}</option>`).join('')}
            </select>
            <button type="button" class="btn btn-ghost btn-sm" onclick="adicionarBancoRapido()">+</button>
          </div>

        <div class="campo"><label>Plano de conta</label>
          <select id="novo-${tipo}-planoconta">
            <option value="">— nenhum —</option>
            ${orcamentoContas.map(c=>`<option value="${c.id}" data-nome="${escapeHtml(c.conta||'')}">${escapeHtml(c.conta||'(sem nome)')}</option>`).join('')}
          </select>
        </div>
        <div class="campo" style="align-self:end;">
          <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
            <input type="checkbox" id="novo-${tipo}-confirmado" style="width:auto;"> Já confirmada (não é previsão)
          </label>
        </div>`;

  const opcoesFormaPagamento = FORMAS_PAGAMENTO
    .map(o=>`<option value="${o}">${o}</option>`).join('');

  const opcoesGrupo = GRUPOS_DRE.map(g=>`<option value="${g}">${g}</option>`).join('');

  return `<div class="secao ativa">

    <div class="cartao">
      <h3>Novo lançamento ${tipo==='receber' ? 'avulso' : ''}</h3>
      <div class="form-linha">
        <div class="campo"><label>${rotuloParte}</label><input type="text" id="novo-${tipo}-parte"></div>
        <div class="campo"><label>Descrição</label><input type="text" id="novo-${tipo}-descricao"></div>
        <div class="campo"><label>Categoria</label><input type="text" id="novo-${tipo}-categoria"></div>
        <div class="campo"><label>Grupo (DRE)</label><select id="novo-${tipo}-grupo">${opcoesGrupo}</select></div>

        <div class="campo"><label>Vencimento</label><input type="date" id="novo-${tipo}-vencimento"></div>
        <div class="campo"><label>Forma de ${tipo==='pagar'?'pagamento':'recebimento'}</label><select id="novo-${tipo}-forma">${opcoesFormaPagamento}</select></div>
        ${camposExtrasForm}
      </div>
      <button class="btn" onclick="adicionarConta('${tipo}')">Adicionar</button>

    <div class="cartao">
      <h3>Lançamentos (${lista.length})</h3>
      <div style="overflow-x:auto;">
        <table class="dyn">
          <thead><tr><th>${rotuloParte}</th><th>Descrição</th><th>Categoria</th><th>Grupo</th><th>Valor</th><th>Vencimento</th><th>${rotuloData}</th><th>Status</th>${extras.join('')}<th>Lançado por</th>${colDocumentos}<th></th></tr></thead>

function celulaDocumentos(c){
  const conta = c.arquivo_conta_path
    ? `<a href="${urlArquivo(c.arquivo_conta_path)}" target="_blank">Boleto/NF</a>`
    : `<label class="link-marcar" style="cursor:pointer;">+ boleto/NF<input type="file" style="display:none" accept="application/pdf,image/*" onchange="anexarArquivo('${c.id}','conta',this)"></label>`;
  const comprovante = c.arquivo_comprovante_path
    ? `<a href="${urlArquivo(c.arquivo_comprovante_path)}" target="_blank">Comprovante</a>`
    : `<label class="link-marcar" style="cursor:pointer;">+ comprovante<input type="file" style="display:none" accept="application/pdf,image/*" onchange="anexarArquivo('${c.id}','comprovante',this)"></label>`;
  return `${conta}<br>${comprovante}`;
}

function urlArquivo(path){
  if(!path) return '#';
  const { data } = supabaseClient.storage.from('comprovantes-financeiro').getPublicUrl(path);
  return data.publicUrl;
}

async function anexarArquivo(contaId, tipoArquivo, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const path = `contas-pagar/${contaId}/${tipoArquivo}-${Date.now()}-${file.name}`;
  const { error: erroUpload } = await supabaseClient.storage.from('comprovantes-financeiro').upload(path, file, {upsert:true});
  if(erroUpload){ alert('Erro ao enviar arquivo: ' + erroUpload.message); return; }
  const campo = tipoArquivo==='conta' ? 'arquivo_conta_path' : 'arquivo_comprovante_path';
  const { error: erroUpdate } = await supabaseClient.from('contas_pagar').update({[campo]: path}).eq('id', contaId);
  if(erroUpdate){ alert('Arquivo enviado, mas houve erro ao vincular: ' + erroUpdate.message); return; }
  await carregarTudo();
  renderAba('pagar');
}

async function adicionarConta(tipo){
  const parteKey = tipo==='pagar' ? 'fornecedor' : 'cliente';
  const registro = {
    [parteKey]: document.getElementById(`novo-${tipo}-parte`).value,
    descricao: document.getElementById(`novo-${tipo}-descricao`).value,
    categoria: document.getElementById(`novo-${tipo}-categoria`).value,
    grupo_dre: document.getElementById(`novo-${tipo}-grupo`).value,
    valor: parseFloat(document.getElementById(`novo-${tipo}-valor`).value) || 0,
    vencimento: document.getElementById(`novo-${tipo}-vencimento`).value || null,
    forma_pagamento: document.getElementById(`novo-${tipo}-forma`).value,
    lancado_por: usuarioAtual,
  };
  if(tipo==='receber'){
    registro.nota_fiscal_numero = document.getElementById('novo-receber-nf').value;
    registro.parcela = document.getElementById('novo-receber-parcela').value;
    registro.representante = document.getElementById('novo-receber-representante').value;
    registro.regiao = document.getElementById('novo-receber-regiao').value;
    registro.pais = document.getElementById('novo-receber-pais').value || 'Brasil';
    registro.banco = document.getElementById('novo-receber-banco').value;
  } else {
    registro.nota_fiscal_fornecedor = document.getElementById('novo-pagar-nf-fornecedor').value;
    registro.banco = document.getElementById('novo-pagar-banco').value;
    registro.confirmado = document.getElementById('novo-pagar-confirmado').checked;
    const selPlano = document.getElementById('novo-pagar-planoconta');
    registro.plano_conta_id = selPlano.value || null;
    registro.plano_conta_nome = selPlano.value ? selPlano.options[selPlano.selectedIndex].dataset.nome : null;
  }
  registro.origem = 'Manual';
  const tabela = tipo==='pagar' ? 'contas_pagar' : 'contas_receber';
  const { error } = await supabaseClient.from(tabela).insert(registro);
  const msg = document.getElementById(`msg-novo-${tipo}`);
  if(error){ msg.textContent='Erro ao salvar'; msg.className='msg ver erro'; console.error(error); return; }
  msg.textContent='Adicionado ✓'; msg.className='msg ver ok';
  await carregarTudo();
  renderAba(tipo);
}

async function alternarConfirmado(id, novoValor){
  await supabaseClient.from('contas_pagar').update({confirmado: novoValor}).eq('id', id);
  await carregarTudo();
  renderAba('pagar');
}

async function marcarComoQuitado(tipo, id){
  const tabela = tipo==='pagar' ? 'contas_pagar' : 'contas_receber';
  const campoData = tipo==='pagar' ? 'data_pagamento' : 'data_recebimento';
  await supabaseClient.from(tabela).update({[campoData]: hojeISO()}).eq('id', id);
  await carregarTudo();
  renderAba(tipo);
}

async function removerConta(tipo, id){
  if(!confirm('Remover este lançamento?')) return;
  const tabela = tipo==='pagar' ? 'contas_pagar' : 'contas_receber';
  await supabaseClient.from(tabela).delete().eq('id', id);
  await carregarTudo();
  renderAba(tipo);
}

/* ================= FLUXO DE CAIXA PROJETADO ================= */
function viewFluxo(){
  const contaFiltro = filtroFluxo.conta || 'todas';

  const movimentos = [];
  contasReceber.forEach(c=>{
    const data = c.data_recebimento || c.vencimento;
    if(data) movimentos.push({data, tipo:'Entrada', valor:Number(c.valor), banco:c.banco||'', origem:'Receber: '+(c.cliente||c.descricao||'')});
  });
  contasPagar.forEach(c=>{
    const data = c.data_pagamento || c.vencimento;
    if(data) movimentos.push({data, tipo:'Saída', valor:-Number(c.valor), banco:c.banco||'', origem:'Pagar: '+(c.fornecedor||c.descricao||'') + (c.confirmado ? '' : ' (previsto)')});
  });
  movimentos.sort((a,b)=> a.data.localeCompare(b.data));

  const saldoInicialEscopo = contaFiltro==='todas'
    ? bancos.reduce((s,b)=>s+Number(b.saldo_inicial||0),0)
    : Number((bancos.find(b=>b.nome===contaFiltro)||{}).saldo_inicial||0);

  const movimentosEscopo = contaFiltro==='todas' ? movimentos : movimentos.filter(m=>m.banco===contaFiltro);

  let saldo = saldoInicialEscopo;
  const linhasCompletas = movimentosEscopo.map(m=>{
    saldo += m.valor;
    return {...m, saldoAcumulado: saldo};
  });

  const visiveis = linhasCompletas.filter(m=>{
    if(filtroFluxo.modo==='entradas' && m.tipo!=='Entrada') return false;
    if(filtroFluxo.modo==='saidas' && m.tipo!=='Saída') return false;
    if(filtroFluxo.dataInicio && m.data < filtroFluxo.dataInicio) return false;
    if(filtroFluxo.dataFim && m.data > filtroFluxo.dataFim) return false;
    return true;
  });

  const linhasHtml = visiveis.map(m=>{
    const cor = m.valor>=0 ? 'var(--ok)' : 'var(--danger)';
    return `<tr>
      <td>${m.data}</td>
      <td>${m.tipo}</td>
      <td>${escapeHtml(m.origem)}</td>
      <td>${escapeHtml(m.banco||'—')}</td>
      <td style="color:${cor}">${moeda(m.valor)}</td>
      <td style="font-weight:bold;">${moeda(m.saldoAcumulado)}</td>
    </tr>`;
  }).join('');

  const opcoesContas = bancos.map(b=>`<option value="${escapeHtml(b.nome)}" ${contaFiltro===b.nome?'selected':''}>${escapeHtml(b.nome)}</option>`).join('');

  return `<div class="secao ativa">
    <h2>Fluxo de Caixa Projetado</h2>
    <p class="desc">Saldo inicial (${moeda(saldoInicialEscopo)}) + contas a pagar/receber dessa conta, ordenado por data. O saldo acumulado sempre considera entradas e saídas juntas, mesmo quando você filtra a visualização.</p>
    ${botaoExportarPDF()}
    <div class="cartao">
      <div class="filtros" style="margin-bottom:14px;">
        <div class="campo-f"><label>Conta bancária</label>
          <select id="fluxo-conta" onchange="mudarContaFluxo(this.value)">
            <option value="todas" ${contaFiltro==='todas'?'selected':''}>Todas as contas</option>
            ${opcoesContas}
          </select>
        </div>
        <div class="campo-f"><label>Ver</label>
          <select id="fluxo-modo" onchange="mudarModoFluxo(this.value)">
            <option value="ambos" ${filtroFluxo.modo==='ambos'?'selected':''}>Entradas e saídas juntas</option>
            <option value="entradas" ${filtroFluxo.modo==='entradas'?'selected':''}>Só entradas (a receber)</option>
            <option value="saidas" ${filtroFluxo.modo==='saidas'?'selected':''}>Só saídas (a pagar)</option>
          </select>
        </div>
        <div class="campo-f"><label>De</label><input type="date" id="fluxo-data-inicio" value="${filtroFluxo.dataInicio}"></div>
        <div class="campo-f"><label>Até</label><input type="date" id="fluxo-data-fim" value="${filtroFluxo.dataFim}"></div>
        <div class="campo-f"><button class="btn btn-sm" onclick="aplicarDatasFluxo()">Aplicar datas</button></div>
      </div>
      <div style="overflow-x:auto;">
        <table class="dyn">
          <thead><tr><th>Data</th><th>Tipo</th><th>Origem</th><th>Conta</th><th>Valor</th><th>Saldo acumulado</th></tr></thead>
          <tbody>${linhasHtml || `<tr><td colspan="6" style="color:var(--muted); padding:16px 8px;">Sem lançamentos com data ainda.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function mudarModoFluxo(valor){
  filtroFluxo.modo = valor;
  renderAba('fluxo');
}

function mudarContaFluxo(valor){
  filtroFluxo.conta = valor;
  renderAba('fluxo');
}

function aplicarDatasFluxo(){
  filtroFluxo.dataInicio = document.getElementById('fluxo-data-inicio').value || '';
  filtroFluxo.dataFim = document.getElementById('fluxo-data-fim').value || '';
  renderAba('fluxo');
}

/* ================= CONCILIAÇÃO BANCÁRIA ================= */
let filtroConciliacao = { conta: 'todas' };
let conciliacaoMultiplaAberta = null;
let conciliacaoMultiplaSelecionadas = new Set();

function alternarConciliacaoMultipla(extratoId){
  if(conciliacaoMultiplaAberta === extratoId){
    conciliacaoMultiplaAberta = null;
  } else {
    conciliacaoMultiplaAberta = extratoId;
    conciliacaoMultiplaSelecionadas = new Set();
  }
  renderAba('conciliacao');
}

function alternarSelecaoMultipla(contaId){
  if(conciliacaoMultiplaSelecionadas.has(contaId)) conciliacaoMultiplaSelecionadas.delete(contaId);
  else conciliacaoMultiplaSelecionadas.add(contaId);
  renderAba('conciliacao');
}

function renderPainelConciliacaoMultipla(e, pool, tabela){
  const somaSelecionada = pool
    .filter(c=>conciliacaoMultiplaSelecionadas.has(c.id))
    .reduce((s,c)=>s+Number(c.valor),0);
  const bateExato = Math.abs(somaSelecionada - Number(e.valor)) < 0.01;

  const linhas = pool.map(c=>{
    const marcado = conciliacaoMultiplaSelecionadas.has(c.id);
    return `<tr>
      <td><input type="checkbox" ${marcado?'checked':''} onchange="alternarSelecaoMultipla('${c.id}')"></td>
      <td>${escapeHtml(c.cliente||c.fornecedor||c.descricao||'')}</td>
      <td>${c.vencimento||''}</td>
      <td>${moeda(c.valor)}</td>
    </tr>`;
  }).join('');

  return `<div style="background:#FBF8F2; border:1px solid #E7DFCC; border-radius:6px; padding:12px 14px; margin-top:10px;">
    <p style="font-size:12.5px; color:var(--muted); margin:0 0 8px;">Marque as contas que juntas formam esse crédito (ex: várias vendas caindo num só depósito de maquininha ou boleto em lote).</p>
    <div style="overflow-x:auto; max-height:220px; overflow-y:auto;">
      <table class="dyn">

      </table>
    </div>

      <button class="btn btn-sm" ${bateExato?'':'disabled'} onclick="confirmarConciliacaoMultipla('${e.id}','${tabela}')">Confirmar conciliação em bloco</button>
    </div>
  </div>`;
}

async function confirmarConciliacaoMultipla(extratoId, tabela){
  const linhaExtrato = extrato.find(e=>e.id===extratoId);
  const tabelaNome = tabela === 'receber' ? 'contas_receber' : 'contas_pagar';
  const campoData = tabela === 'receber' ? 'data_recebimento' : 'data_pagamento';
  const dataConciliacao = linhaExtrato ? linhaExtrato.data : hojeISO();

  for(const contaId of conciliacaoMultiplaSelecionadas){
    const atualizacao = { [campoData]: dataConciliacao };
    if(tabela === 'pagar') atualizacao.confirmado = true;
    await supabaseClient.from(tabelaNome).update(atualizacao).eq('id', contaId);
  }
  await supabaseClient.from('extrato_bancario').update({conciliado:true}).eq('id', extratoId);

  conciliacaoMultiplaAberta = null;
  conciliacaoMultiplaSelecionadas = new Set();
  await carregarTudo();
  renderAba('conciliacao');
}

/* ================= IMPORTAÇÃO DE EXTRATO (OFX / CSV) ================= */
let transacoesImportadas = []; // [{data, descricao, valor, tipo, incluir}]
let cabecalhoCsvBruto = null;
let linhasCsvBrutas = null;

function processarArquivoImportacao(){
  const bancoSelecionado = document.getElementById('import-banco').value;
  const arquivoInput = document.getElementById('import-arquivo');
  const msg = document.getElementById('msg-importar');
  msg.textContent = ''; msg.className = 'msg';

  if(!bancoSelecionado){ msg.textContent = 'Selecione a conta bancária desse extrato.'; msg.className = 'msg erro'; return; }
  const arquivo = arquivoInput.files[0];
  if(!arquivo){ msg.textContent = 'Escolha um arquivo.'; msg.className = 'msg erro'; return; }

  const leitor = new FileReader();
  leitor.onload = (e) => {
    const conteudo = e.target.result;
    const nomeArquivo = arquivo.name.toLowerCase();
    if(nomeArquivo.endsWith('.ofx')){
      transacoesImportadas = parsearOFX(conteudo);
      mostrarPreviaImportacao();
    } else {
      // CSV ou TXT
      const delimitador = (conteudo.split('\n')[0].split(';').length > conteudo.split('\n')[0].split(',').length) ? ';' : ',';
      const linhas = conteudo.split(/\r?\n/).filter(l=>l.trim().length>0).map(l=>l.split(delimitador).map(c=>c.trim().replace(/^"|"$/g,'')));
      cabecalhoCsvBruto = linhas[0];
      linhasCsvBrutas = linhas.slice(1);
      const indices = detectarColunasCsv(cabecalhoCsvBruto);
      if(indices.data===-1 || indices.descricao===-1 || indices.valor===-1){
        mostrarMapeamentoCsv(cabecalhoCsvBruto);
      } else {
        transacoesImportadas = converterCsvParaTransacoes(linhasCsvBrutas, indices);
        mostrarPreviaImportacao();
      }
    }
  };
  leitor.readAsText(arquivo, 'ISO-8859-1');
}

function parsearOFX(texto){
  const blocos = texto.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/g) || [];
  return blocos.map(bloco=>{
    const pegar = (tag) => {
      const m = bloco.match(new RegExp(`<${tag}>([^<\r\n]*)`));
      return m ? m[1].trim() : '';
    };
    const dataBruta = pegar('DTPOSTED').slice(0,8); // AAAAMMDD
    const data = dataBruta.length===8 ? `${dataBruta.slice(0,4)}-${dataBruta.slice(4,6)}-${dataBruta.slice(6,8)}` : '';
    let valor = parseFloat(pegar('TRNAMT').replace(',','.')) || 0;
    const descricao = pegar('MEMO') || pegar('NAME') || '(sem descrição)';
    return {
      data,
      descricao,
      valor: Math.abs(valor),
      tipo: valor >= 0 ? 'Entrada' : 'Saída',
      incluir: true,
    };
  }).filter(t=>t.data);
}

function detectarColunasCsv(cabecalho){
  const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const cab = cabecalho.map(norm);
  const achar = (opcoes) => cab.findIndex(c => opcoes.some(o=>c.includes(o)));
  return {
    data: achar(['data','date']),
    descricao: achar(['descricao','historico','memo','description']),
    valor: achar(['valor','value','amount','montante']),
  };
}

function converterCsvParaTransacoes(linhas, indices){
  return linhas.map(cols=>{
    let dataBruta = (cols[indices.data]||'').trim();
    let data = '';
    if(/^\d{4}-\d{2}-\d{2}/.test(dataBruta)) data = dataBruta.slice(0,10);
    else {
      const m = dataBruta.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if(m){
        let [,d,mes,ano] = m;
        if(ano.length===2) ano = '20'+ano;
        data = `${ano}-${mes.padStart(2,'0')}-${d.padStart(2,'0')}`;
      }
    }
    const descricao = (cols[indices.descricao]||'').trim() || '(sem descrição)';
    let valorTexto = (cols[indices.valor]||'0').replace(/[R$\s]/g,'');
    if(valorTexto.includes(',')) valorTexto = valorTexto.replace(/\./g,'').replace(',','.');
    const valor = parseFloat(valorTexto) || 0;
    return {
      data, descricao,
      valor: Math.abs(valor),
      tipo: valor >= 0 ? 'Entrada' : 'Saída',
      incluir: true,
    };
  }).filter(t=>t.data);
}

function mostrarMapeamentoCsv(cabecalho){
  const area = document.getElementById('area-mapeamento-csv');
  const opcoes = cabecalho.map((h,i)=>`<option value="${i}">${escapeHtml(h||'(coluna '+(i+1)+')')}</option>`).join('');
  area.innerHTML = `
    <div class="cartao" style="margin-top:14px;">
      <h4 style="margin-top:0;">Não identifiquei as colunas automaticamente — selecione qual é qual:</h4>
      <div class="form-linha">
        <div class="campo"><label>Coluna da data</label><select id="map-data">${opcoes}</select></div>
        <div class="campo"><label>Coluna da descrição</label><select id="map-descricao">${opcoes}</select></div>
        <div class="campo"><label>Coluna do valor</label><select id="map-valor">${opcoes}</select></div>
        <div class="campo" style="align-self:end;"><button class="btn btn-sm" onclick="confirmarMapeamentoCsv()">Gerar prévia</button></div>
      </div>
    </div>`;
}

function confirmarMapeamentoCsv(){
  const indices = {
    data: parseInt(document.getElementById('map-data').value,10),
    descricao: parseInt(document.getElementById('map-descricao').value,10),
    valor: parseInt(document.getElementById('map-valor').value,10),
  };
  transacoesImportadas = converterCsvParaTransacoes(linhasCsvBrutas, indices);
  document.getElementById('area-mapeamento-csv').innerHTML = '';
  mostrarPreviaImportacao();
}

function mostrarPreviaImportacao(){
  const area = document.getElementById('area-previa-importacao');
  const msg = document.getElementById('msg-importar');
  if(transacoesImportadas.length === 0){
    area.innerHTML = '';
    msg.textContent = 'Não consegui reconhecer nenhum lançamento nesse arquivo.';
    msg.className = 'msg erro';
    return;
  }
  msg.textContent = `${transacoesImportadas.length} lançamentos encontrados — revise abaixo antes de importar.`;
  msg.className = 'msg ok';

  const linhas = transacoesImportadas.map((t,i)=>`
    <tr>
      <td><input type="checkbox" ${t.incluir?'checked':''} onchange="transacoesImportadas[${i}].incluir=this.checked"></td>
      <td>${t.data}</td>
      <td>${escapeHtml(t.descricao)}</td>
      <td><span class="tag-tipo ${t.tipo==='Entrada'?'tag-entrada':'tag-saida'}">${t.tipo}</span></td>
      <td>${moeda(t.valor)}</td>
    </tr>`).join('');

  area.innerHTML = `
    <div class="cartao" style="margin-top:14px;">
      <h4 style="margin-top:0;">Prévia da importação (${transacoesImportadas.length})</h4>
      <div style="overflow-x:auto; max-height:340px; overflow-y:auto;">
        <table class="dyn">
          <thead><tr><th></th><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
      <button class="btn" style="margin-top:12px;" onclick="confirmarImportacao()">Importar selecionados</button>
      <span class="msg" id="msg-confirmar-importacao"></span>
    </div>`;
}

async function confirmarImportacao(){
  const bancoSelecionado = document.getElementById('import-banco').value;
  const msg = document.getElementById('msg-confirmar-importacao');
  const selecionadas = transacoesImportadas.filter(t=>t.incluir);
  if(selecionadas.length===0){ msg.textContent='Nenhum item selecionado.'; msg.className='msg erro'; return; }

  msg.textContent = 'Importando...'; msg.className = 'msg';

  // Evita duplicar: pula linhas que já existem (mesma data + valor + tipo + banco)
  let importadas = 0, ignoradas = 0;
  for(const t of selecionadas){
    const jaExiste = extrato.some(e => e.banco===bancoSelecionado && e.data===t.data && e.tipo===t.tipo && Math.abs(Number(e.valor)-t.valor) < 0.01);
    if(jaExiste){ ignoradas++; continue; }
    const { error } = await supabaseClient.from('extrato_bancario').insert({
      data: t.data, descricao: t.descricao, tipo: t.tipo, valor: t.valor,
      banco: bancoSelecionado, conciliado: false, lancado_por: usuarioAtual,
    });
    if(!error) importadas++;
  }

  transacoesImportadas = [];
  document.getElementById('area-previa-importacao').innerHTML = '';
  document.getElementById('import-arquivo').value = '';
  await carregarTudo();
  renderAba('conciliacao');
  const msgFinal = document.getElementById('msg-importar');
  if(msgFinal) { msgFinal.textContent = `${importadas} importados, ${ignoradas} ignorados (já existiam).`; msgFinal.className = 'msg ok'; }
}

async function criarEConciliarNovo(){

async function confirmarConciliacao(extratoId, contaId, tabela){
  if(contaId && tabela){
    const linhaExtrato = extrato.find(e=>e.id===extratoId);
    const tabelaNome = tabela === 'receber' ? 'contas_receber' : 'contas_pagar';
    const campoData = tabela === 'receber' ? 'data_recebimento' : 'data_pagamento';
    const atualizacao = { [campoData]: linhaExtrato ? linhaExtrato.data : hojeISO() };
    if(tabela === 'pagar') atualizacao.confirmado = true;
    await supabaseClient.from(tabelaNome).update(atualizacao).eq('id', contaId);
  }
  await supabaseClient.from('extrato_bancario').update({conciliado:true}).eq('id', extratoId);
  await carregarTudo();
  renderAba('conciliacao');
}

}

      if(f.representante && !(c.representante||'').toLowerCase().includes(f.representante.toLowerCase())) return false;
      if(f.regiao && !(c.regiao||'').toLowerCase().includes(f.regiao.toLowerCase())) return false;

    </div>` : `

function navegarSemana(tipo, deltaDias){
  const f = filtrosRelatorio[tipo];

/* ================= DRE GERENCIAL ================= */
let periodoDRE = { inicio: (()=>{ const d=new Date(); d.setDate(1); return formatarISO(d); })(), fim: hojeISOsafe() };

function contarMesesNoPeriodo(inicioISO, fimISO){
  const i = new Date(inicioISO + 'T00:00:00');
  const f = new Date(fimISO + 'T00:00:00');
  const meses = (f.getFullYear()-i.getFullYear())*12 + (f.getMonth()-i.getMonth()) + 1;
  return Math.max(1, meses);
}

function definirPeriodoRapido(tipo){
  const hoje = new Date();
  let inicio, fim;
  if(tipo==='mes'){
    inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  } else if(tipo==='trimestre'){
    const iniTrimestre = Math.floor(hoje.getMonth()/3)*3;
    inicio = new Date(hoje.getFullYear(), iniTrimestre, 1);
    fim = new Date(hoje.getFullYear(), iniTrimestre+3, 0);
  } else if(tipo==='semestre'){
    const iniSemestre = hoje.getMonth() < 6 ? 0 : 6;
    inicio = new Date(hoje.getFullYear(), iniSemestre, 1);
    fim = new Date(hoje.getFullYear(), iniSemestre+6, 0);
  } else if(tipo==='ano'){
    inicio = new Date(hoje.getFullYear(), 0, 1);
    fim = new Date(hoje.getFullYear(), 11, 31);
  }
  periodoDRE.inicio = formatarISO(inicio);
  periodoDRE.fim = formatarISO(fim);
  renderAba(abaAtiva);
}

let dreDetalheAberto = null;

function lancamentosDoGrupoDRE(key, receber, pagar){
  const mapReceber = c => ({data:c.data_recebimento, parte:c.cliente, desc:c.descricao, valor:Number(c.valor)});
  const mapPagar = c => ({data:c.data_pagamento, parte:c.fornecedor, desc:c.descricao, valor:Number(c.valor)});
  switch(key){
    case 'receitaBruta': return receber.filter(c=>(c.grupo_dre||'Outro')==='Receita').map(mapReceber);
    case 'deducoes': return [
      ...receber.filter(c=>(c.grupo_dre||'Outro')==='Dedução de Receita').map(mapReceber),
      ...pagar.filter(c=>(c.grupo_dre||'Outro')==='Dedução de Receita').map(mapPagar),
    ];
    case 'custoVariavel': return pagar.filter(c=>(c.grupo_dre||'Outro')==='Custo Variável').map(mapPagar);
    case 'custoFixo': return pagar.filter(c=>(c.grupo_dre||'Outro')==='Custo Fixo').map(mapPagar);
    case 'despesaOperacional': return pagar.filter(c=>(c.grupo_dre||'Outro')==='Despesa Operacional').map(mapPagar);
    case 'despesaFinanceira': return pagar.filter(c=>(c.grupo_dre||'Outro')==='Despesa Financeira').map(mapPagar);
    case 'investimentos': return pagar.filter(c=>(c.grupo_dre||'Outro')==='Investimento').map(mapPagar);
    default: return [];
  }
}

function viewDRE(){
  const receber = contasReceber.filter(c=>c.data_recebimento && c.data_recebimento>=periodoDRE.inicio && c.data_recebimento<=periodoDRE.fim);
  const pagar = contasPagar.filter(c=>c.data_pagamento && c.data_pagamento>=periodoDRE.inicio && c.data_pagamento<=periodoDRE.fim);

  const somaGrupo = (lista, grupo) => lista.filter(c=>(c.grupo_dre||'Outro')===grupo).reduce((s,c)=>s+Number(c.valor),0);

  const receitaBruta = somaGrupo(receber,'Receita');
  const deducoes = somaGrupo(receber,'Dedução de Receita') + somaGrupo(pagar,'Dedução de Receita');
  const receitaLiquida = receitaBruta - deducoes;
  const custoVariavel = somaGrupo(pagar,'Custo Variável');
  const margemContribuicao = receitaLiquida - custoVariavel;
  const custoFixo = somaGrupo(pagar,'Custo Fixo');
  const despesaOperacional = somaGrupo(pagar,'Despesa Operacional');
  const resultadoOperacional = margemContribuicao - custoFixo - despesaOperacional;
  const despesaFinanceira = somaGrupo(pagar,'Despesa Financeira');
  const resultadoLiquido = resultadoOperacional - despesaFinanceira;
  const investimentos = somaGrupo(pagar,'Investimento');

  const ICONES_DRE = {
    receitaBruta: {simbolo:'↑', cor:'var(--ok)'},
    deducoes: {simbolo:'↓', cor:'var(--danger)'},
    custoVariavel: {simbolo:'↓', cor:'var(--danger)'},
    custoFixo: {simbolo:'↓', cor:'var(--danger)'},
    despesaOperacional: {simbolo:'↓', cor:'var(--danger)'},
    despesaFinanceira: {simbolo:'↓', cor:'var(--danger)'},
    investimentos: {simbolo:'★', cor:'var(--gold)'},
  };

  const linhaDetalhe = (key) => {
    if(dreDetalheAberto !== key) return '';
    const itens = lancamentosDoGrupoDRE(key, receber, pagar);
    const linhasItens = itens.map(i=>`<tr>
      <td style="padding-left:44px; color:var(--muted); font-size:12.5px;">${i.data||''}</td>
      <td style="color:var(--muted); font-size:12.5px;" colspan="1">${escapeHtml(i.parte||i.desc||'')}</td>
      <td style="text-align:right; color:var(--muted); font-size:12.5px;">${moeda(i.valor)}</td>
    </tr>`).join('');
    return `<tr><td colspan="2" style="padding:0; background:#FBF8F2;">
      <table class="dyn" style="margin:0;">
        ${linhasItens || `<tr><td colspan="3" style="color:var(--muted); font-size:12.5px; padding:8px 44px;">Nenhum lançamento nesse grupo, no período.</td></tr>`}
      </table>
    </td></tr>`;
  };

  const linha = (label, valor, opts={}) => {
    const { destaque=false, key=null } = opts;
    const icone = key && ICONES_DRE[key];
    const clicavel = key ? `onclick="alternarDetalheDRE('${key}')" class="linha-dre-clicavel"` : '';
    const seta = key ? `<span style="color:var(--muted); font-size:10px; width:12px; display:inline-block;">${dreDetalheAberto===key ? '▾' : '▸'}</span>` : `<span style="width:12px; display:inline-block;"></span>`;
    const badge = icone ? `<span style="display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:${icone.cor}20; color:${icone.cor}; font-size:12px; font-weight:bold; margin-right:10px;">${icone.simbolo}</span>` : `<span style="width:32px; display:inline-block;"></span>`;
    const estiloLinha = destaque
      ? 'font-weight:bold; background:#FBF6EA; border-left:3px solid var(--gold);'
      : '';
    return `<tr ${clicavel} style="${estiloLinha}">
      <td style="padding:${destaque?'12px 10px':'9px 10px'};">${seta}${badge}<span style="${destaque?'font-size:14.5px;':''}">${label}</span></td>
      <td style="text-align:right; padding:${destaque?'12px 10px':'9px 10px'}; ${destaque?'font-size:14.5px;':''}">${moeda(valor)}</td>
    </tr>${key ? linhaDetalhe(key) : ''}`;
  };

  return `<div class="secao ativa">
    <h2 style="display:flex; align-items:center; gap:10px;">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; background:var(--navy); color:var(--gold); font-size:16px;">📊</span>
      DRE Gerencial
    </h2>
    <p class="desc">Baseado no que foi efetivamente pago e recebido (regime de caixa) no período, classificado pelo Grupo (DRE) de cada lançamento. Clique numa linha para ver os lançamentos que a compõem.</p>
    ${botaoExportarPDF()}

    <div class="cartao">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('mes')">Este mês</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('trimestre')">Este trimestre</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('semestre')">Este semestre</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('ano')">Este ano</button>
      </div>
      <div class="form-linha">
        <div class="campo"><label>De</label><input type="date" id="dre-inicio" value="${periodoDRE.inicio}"></div>
        <div class="campo"><label>Até</label><input type="date" id="dre-fim" value="${periodoDRE.fim}"></div>
        <div class="campo" style="align-self:end;"><button class="btn btn-sm" onclick="atualizarPeriodoDRE()">Atualizar período</button></div>
      </div>
      <div class="ajuda" style="font-size:12px; color:var(--muted); margin-top:4px;">Esse período também vale para a aba Orçado x Realizado.</div>
    </div>

    <div class="cartao">
      <table class="dyn">
        ${linha('Receita Bruta', receitaBruta, {key:'receitaBruta'})}
        ${linha('(–) Deduções de Receita', -deducoes, {key:'deducoes'})}
        ${linha('= Receita Líquida', receitaLiquida, {destaque:true})}
        ${linha('(–) Custos Variáveis', -custoVariavel, {key:'custoVariavel'})}
        ${linha('= Margem de Contribuição', margemContribuicao, {destaque:true})}
        ${linha('(–) Custos Fixos', -custoFixo, {key:'custoFixo'})}
        ${linha('(–) Despesas Operacionais', -despesaOperacional, {key:'despesaOperacional'})}
        ${linha('= Resultado Operacional', resultadoOperacional, {destaque:true})}
        ${linha('(–) Despesas Financeiras', -despesaFinanceira, {key:'despesaFinanceira'})}
        ${linha('= Resultado Líquido do Período', resultadoLiquido, {destaque:true})}
        ${linha('Investimentos no período (informativo)', investimentos, {key:'investimentos'})}
      </table>
    </div>
  </div>`;
}

function alternarDetalheDRE(key){
  dreDetalheAberto = (dreDetalheAberto === key) ? null : key;
  renderAba('dre');
}

function atualizarPeriodoDRE(){
  periodoDRE.inicio = document.getElementById('dre-inicio').value;
  periodoDRE.fim = document.getElementById('dre-fim').value;
  renderAba('dre');
}

/* ================= ORÇADO X REALIZADO ================= */
function viewOrcadoRealizado(){
  const receber = contasReceber.filter(c=>c.data_recebimento && c.data_recebimento>=periodoDRE.inicio && c.data_recebimento<=periodoDRE.fim);
  const pagar = contasPagar.filter(c=>c.data_pagamento && c.data_pagamento>=periodoDRE.inicio && c.data_pagamento<=periodoDRE.fim && c.confirmado);

  const meses = contarMesesNoPeriodo(periodoDRE.inicio, periodoDRE.fim);

  const realizadoPorGrupo = {};
  GRUPOS_DRE.forEach(g=> realizadoPorGrupo[g] = 0);
  receber.forEach(c=>{ const g=c.grupo_dre||'Outro'; realizadoPorGrupo[g]=(realizadoPorGrupo[g]||0)+Number(c.valor); });
  pagar.forEach(c=>{ const g=c.grupo_dre||'Outro'; realizadoPorGrupo[g]=(realizadoPorGrupo[g]||0)+Number(c.valor); });

  const orcadoPorGrupo = {};
  GRUPOS_DRE.forEach(g=> orcadoPorGrupo[g] = 0);
  (orcamentoContas||[]).forEach(linha=>{
    const g = linha.tipo || 'Outro';
    const v = parseFloat(String(linha.orcado||'0').replace(/[^\d.,-]/g,'').replace(',','.')) || 0;
    orcadoPorGrupo[g] = (orcadoPorGrupo[g]||0) + v * meses;
  });

  const linhas = GRUPOS_DRE.map(g=>{
    const orc = orcadoPorGrupo[g]||0;
    const real = realizadoPorGrupo[g]||0;
    const dif = real - orc;
    const pct = orc!==0 ? (dif/orc*100) : (real!==0 ? 100 : 0);
    const cor = dif===0 ? 'var(--ink)' : (dif>0 ? 'var(--danger)' : 'var(--ok)');
    return `<tr>
      <td>${g}</td>
      <td>${moeda(orc)}</td>
      <td>${moeda(real)}</td>
      <td style="color:${cor}">${moeda(dif)}</td>
      <td style="color:${cor}">${orc!==0 ? pct.toFixed(1)+'%' : '—'}</td>
    </tr>`;
  }).join('');

  const linhasPorConta = (orcamentoContas||[]).map(conta=>{
    const orcMensal = parseFloat(String(conta.orcado||'0').replace(/[^\d.,-]/g,'').replace(',','.')) || 0;
    const orc = orcMensal * meses;
    const real = pagar.filter(c=>c.plano_conta_id===conta.id).reduce((s,c)=>s+Number(c.valor),0);
    const dif = real - orc;
    const cor = dif===0 ? 'var(--ink)' : (dif>0 ? 'var(--danger)' : 'var(--ok)');
    return `<tr>
      <td>${escapeHtml(conta.conta||'(sem nome)')}</td>
      <td>${escapeHtml(conta.tipo||'')}</td>
      <td>${moeda(orcMensal)}</td>
      <td>${moeda(orc)}</td>
      <td>${moeda(real)}</td>
      <td style="color:${cor}">${moeda(dif)}</td>
    </tr>`;
  }).join('');

  return `<div class="secao ativa">
    <h2>Orçado x Realizado</h2>
    <p class="desc">Orçado vem do Plano de Contas (módulo Planejamento — valor mensal). Realizado é o pago/recebido e <b>confirmado</b> no período selecionado (${formatarDataBR(periodoDRE.inicio)} a ${formatarDataBR(periodoDRE.fim)} — ${meses} mês${meses>1?'es':''}). O orçado é multiplicado automaticamente pelo número de meses do período, então dá pra comparar mensal, trimestral, semestral ou anual sem ajustar nada na mão.</p>
    ${botaoExportarPDF()}

    <div class="cartao">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('mes')">Este mês</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('trimestre')">Este trimestre</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('semestre')">Este semestre</button>
        <button class="btn btn-ghost btn-sm" onclick="definirPeriodoRapido('ano')">Este ano</button>
      </div>
      <div class="form-linha">
        <div class="campo"><label>De</label><input type="date" id="dre-inicio" value="${periodoDRE.inicio}"></div>
        <div class="campo"><label>Até</label><input type="date" id="dre-fim" value="${periodoDRE.fim}"></div>
        <div class="campo" style="align-self:end;"><button class="btn btn-sm" onclick="atualizarPeriodoDRE()">Atualizar período</button></div>
      </div>
    </div>

    <div class="cartao">
      <h3>Por grupo (DRE)</h3>
      <div style="overflow-x:auto;">
        <table class="dyn">
          <thead><tr><th>Grupo</th><th>Orçado (período)</th><th>Realizado</th><th>Diferença</th><th>% vs. orçado</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    </div>
    <div class="cartao">
      <h3>Por conta do plano de contas</h3>
      <div style="overflow-x:auto;">
        <table class="dyn">
          <thead><tr><th>Conta</th><th>Grupo</th><th>Orçado (mensal)</th><th>Orçado (período)</th><th>Realizado</th><th>Diferença</th></tr></thead>
          <tbody>${linhasPorConta || `<tr><td colspan="6" style="color:var(--muted); padding:12px 8px;">Nenhuma conta no plano de contas ainda.</td></tr>`}</tbody>
        </table>
      </div>
      ${(!orcamentoContas || orcamentoContas.length===0) ? '<p style="color:var(--muted); font-size:13px; margin-top:10px;">Nenhum orçamento cadastrado ainda no Planejamento → Orçamento (Plano de Contas).</p>' : ''}
    </div>
  </div>`;
}

/* ================= PLANEJAMENTO SEMANAL (A PAGAR + A RECEBER) ================= */
function viewSemanal(){
  const { inicio, fim } = rangeSemana(filtroSemanal.semanaRef);

  const receberSemana = contasReceber.filter(c=> c.vencimento && c.vencimento>=inicio && c.vencimento<=fim);
  const pagarSemana = contasPagar.filter(c=> c.vencimento && c.vencimento>=inicio && c.vencimento<=fim);

  const totalReceber = receberSemana.reduce((s,c)=>s+Number(c.valor),0);
  const totalPagar = pagarSemana.reduce((s,c)=>s+Number(c.valor),0);
  const saldoSemana = totalReceber - totalPagar;

  const linhaReceber = c => `<tr>
    <td>${c.vencimento}</td><td>Receber</td><td>${escapeHtml(c.cliente||'')}</td>
    <td>${escapeHtml(c.descricao||'')}</td><td>${moeda(c.valor)}</td>
    <td>${badgeStatus(statusConta(c,'receber'))}</td></tr>`;
  const linhaPagar = c => `<tr>
    <td>${c.vencimento}</td><td>Pagar</td><td>${escapeHtml(c.fornecedor||'')}</td>
    <td>${escapeHtml(c.descricao||'')} ${c.confirmado ? '' : '<span class="badge badge-pendente">Previsto</span>'}</td>
    <td>${moeda(c.valor)}</td><td>${badgeStatus(statusConta(c,'pagar'))}</td></tr>`;

  let tabelaHtml = '';
  if(filtroSemanal.modo==='ambos'){
    const combinadas = [...receberSemana.map(c=>({...c,_tipo:'receber'})), ...pagarSemana.map(c=>({...c,_tipo:'pagar'}))]
      .sort((a,b)=> (a.vencimento||'').localeCompare(b.vencimento||''));
    const linhas = combinadas.map(c=> c._tipo==='receber' ? linhaReceber(c) : linhaPagar(c)).join('');
    tabelaHtml = `<div class="cartao"><h3>A receber e a pagar da semana</h3>
      <div style="overflow-x:auto;"><table class="dyn">
        <thead><tr><th>Vencimento</th><th>Tipo</th><th>Cliente/Fornecedor</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="6" style="color:var(--muted); padding:14px 8px;">Nada nessa semana.</td></tr>`}</tbody>
      </table></div></div>`;
  } else if(filtroSemanal.modo==='receber'){
    tabelaHtml = `<div class="cartao"><h3>A receber da semana</h3>
      <div style="overflow-x:auto;"><table class="dyn">
        <thead><tr><th>Vencimento</th><th>Tipo</th><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>${receberSemana.map(linhaReceber).join('') || `<tr><td colspan="6" style="color:var(--muted); padding:14px 8px;">Nada a receber nessa semana.</td></tr>`}</tbody>
      </table></div></div>`;
  } else {
    tabelaHtml = `<div class="cartao"><h3>A pagar da semana</h3>
      <div style="overflow-x:auto;"><table class="dyn">
        <thead><tr><th>Vencimento</th><th>Tipo</th><th>Fornecedor</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>${pagarSemana.map(linhaPagar).join('') || `<tr><td colspan="6" style="color:var(--muted); padding:14px 8px;">Nada a pagar nessa semana.</td></tr>`}</tbody>
      </table></div></div>`;
  }

  return `<div class="secao ativa">
    <h2>Planejamento Semanal</h2>
    <p class="desc">Semana de segunda a domingo — o que entra e o que sai, junto ou separado.</p>

    <div class="cartao">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="navegarSemanaGeral(-7)">← Semana anterior</button>
        <strong>${formatarDataBR(inicio)} a ${formatarDataBR(fim)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="navegarSemanaGeral(7)">Semana seguinte →</button>
        <select id="semanal-modo" onchange="mudarModoSemanal(this.value)" style="margin-left:auto;">
          <option value="ambos" ${filtroSemanal.modo==='ambos'?'selected':''}>Ver os dois juntos</option>
          <option value="receber" ${filtroSemanal.modo==='receber'?'selected':''}>Só a receber</option>
          <option value="pagar" ${filtroSemanal.modo==='pagar'?'selected':''}>Só a pagar</option>
        </select>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi pos"><div class="label">Total a receber na semana</div><div class="valor">${moeda(totalReceber)}</div></div>
      <div class="kpi neg"><div class="label">Total a pagar na semana</div><div class="valor">${moeda(totalPagar)}</div></div>
      <div class="kpi ${saldoSemana>=0?'pos':'neg'}"><div class="label">Saldo líquido da semana</div><div class="valor">${moeda(saldoSemana)}</div></div>
    </div>

    ${tabelaHtml}
  </div>`;
}

function navegarSemanaGeral(deltaDias){
  const d = new Date(filtroSemanal.semanaRef + 'T00:00:00');
  d.setDate(d.getDate() + deltaDias);
  filtroSemanal.semanaRef = formatarISO(d);
  renderAba('semanal');
}
function mudarModoSemanal(valor){
  filtroSemanal.modo = valor;
  renderAba('semanal');
}

function ativarHandlers(){ /* reservado */ }
</script>
