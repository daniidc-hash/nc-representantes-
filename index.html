<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NC · Painel do Representante</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --navy: #14213D;
    --navy-dark: #0D162A;
    --beige: #EFE6D6;
    --beige-2: #E7DAC2;
    --yellow: #F4B740;
    --yellow-dark: #D89A1F;
    --text: #1F2530;
    --muted: #8A8578;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--beige); color: var(--text); }

  .login-wrap { min-height: 100vh; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--beige); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.3); width: 100%; max-width: 380px; padding: 28px; }
  .login-title { text-align: center; color: var(--navy); font-size: 22px; font-weight: 700; margin: 0 0 2px; }
  .login-sub { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .switcher { display: flex; background: var(--beige-2); border-radius: 8px; padding: 4px; margin-bottom: 18px; flex-wrap: wrap; }
  .switcher button { flex: 1; border: none; background: transparent; padding: 8px; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .switcher button.active { background: #fff; color: var(--navy); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .erro { color: #b3261e; font-size: 12px; margin: -4px 0 10px; }

  label.campo { display: block; margin-bottom: 12px; }
  label.campo span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .02em; }
  .input, select.input, input.input, textarea.input { width: 100%; border: 1px solid #d9cfb8; border-radius: 6px; padding: 9px 10px; font-size: 14px; background: #fff; color: var(--text); font-family: inherit; }
  .input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 2px rgba(20,33,61,.15); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .btn { display: inline-block; border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-yellow { background: var(--yellow); color: var(--navy); }
  .btn-yellow:hover { background: var(--yellow-dark); }
  .btn-secondary { background: var(--beige-2); color: var(--text); border: 1px solid #d9cfb8; }
  .btn-secondary:hover { background: #ddd0b3; }
  .btn-ghost { background: transparent; color: var(--navy); }
  .btn-ghost:hover { background: #eef0f5; }
  .btn-danger { background: #fbeceb; color: #b3261e; border: 1px solid #f3d3d1; }
  .btn-danger:hover { background: #f6d9d7; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  .header { background: var(--navy); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header.gestor { background: var(--navy-dark); }
  .header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .header p { font-size: 11px; margin: 2px 0 0; opacity: .8; }
  .tabs { background: #fff; border-bottom: 1px solid #eadfc7; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; }
  .tab { padding: 12px 14px; font-size: 13px; font-weight: 700; color: var(--muted); border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; margin-bottom: -1px; white-space: nowrap; }
  .tab.active { color: var(--navy); border-bottom-color: var(--yellow); }
  main { padding: 24px; max-width: 1080px; margin: 0 auto; }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .section-head h2 { font-size: 18px; margin: 0; color: var(--text); }

  .card { background: #fff; border: 1px solid #eadfc7; border-radius: 8px; }
  .empty { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f2ecdc; gap: 10px; flex-wrap: wrap; }
  .list-item:last-child { border-bottom: none; }
  .list-item .titulo { font-weight: 700; font-size: 14px; margin: 0; }
  .list-item .sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-gray { background: #eee6d6; color: #6b625a; }
  .badge-amber { background: #fdecc5; color: #91650a; }
  .badge-green { background: #dcefe0; color: #2f7a3a; }
  .badge-red { background: #fbeceb; color: #b3261e; }
  .badge-blue { background: #dde6f5; color: #1e3a6e; }

  select.status-select { font-size: 12px; padding: 5px 6px; border-radius: 6px; border: 1px solid #d9cfb8; }

  .overlay { position: fixed; inset: 0; background: rgba(15,20,30,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,.3); width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  .modal.wide { max-width: 760px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eee6d6; }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-head button { border: none; background: none; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; }
  .modal-body { padding: 20px; }

  table.itens { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  table.itens th { text-align: left; font-size: 11px; color: var(--muted); border-bottom: 1px solid #eee6d6; padding: 4px 4px; }
  table.itens td { padding: 7px 4px; border-bottom: 1px solid #f2ebdd; }
  .rem-link { color: #b3261e; font-size: 11px; background: none; border: none; cursor: pointer; }
  .add-box { background: #FBF6EA; border: 1px solid #eee6d6; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .add-box p { font-size: 12px; color: #7a716a; margin: 0 0 8px; font-weight: 700; }
  .add-row { display: flex; gap: 8px; }
  .add-row .qtd { width: 80px; flex: none; }
  .total-line { text-align: right; font-size: 13px; margin: 3px 0; }
  .total-line b { font-size: 16px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

  .print-toolbar { padding: 14px 20px; border-bottom: 1px solid #eadfc7; display: flex; justify-content: space-between; align-items: center; }
  .print-doc { max-width: 640px; margin: 0 auto; padding: 40px; }
  .print-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--navy); padding-bottom: 14px; margin-bottom: 22px; }
  .print-head h1 { color: var(--navy); font-size: 26px; margin: 0; }
  .print-head .sub { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
  .print-head .doc-num { font-weight: 700; margin: 0; font-size: 14px; }
  .print-head .doc-date { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; font-size: 13px; }
  .print-grid .lbl { font-size: 10px; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; letter-spacing: .03em; }
  .print-grid .val { font-weight: 700; margin: 0; }
  table.print-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
  table.print-table th { text-align: left; border-bottom: 2px solid #d9cfb8; padding: 8px 4px; color: #6b625a; }
  table.print-table td { border-bottom: 1px solid #eee6d6; padding: 8px 4px; }
  .print-summary { margin-left: auto; width: 260px; font-size: 13px; }
  .print-summary div { display: flex; justify-content: space-between; padding: 3px 0; }
  .print-summary .final { border-top: 2px solid var(--navy); margin-top: 6px; padding-top: 8px; font-size: 20px; font-weight: 800; color: var(--navy); }
  .print-foot { font-size: 11px; color: #c2b8a3; margin-top: 36px; padding-top: 14px; border-top: 1px solid #eee6d6; }

  .banner-config { background: #fdecc5; color: #7a5300; font-size: 12px; text-align: center; padding: 8px; }
  .banner-alert { background: #fbeceb; color: #8a2018; font-size: 13px; padding: 10px 24px; }
  .loading-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: #fff; border: 1px solid #eadfc7; border-radius: 10px; padding: 16px; }
  .kpi-card .lbl { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: .02em; margin: 0 0 6px; }
  .kpi-card .val { font-size: 24px; font-weight: 800; color: var(--navy); margin: 0; }

  .map-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 70px); gap: 8px; margin-bottom: 24px; max-width: 520px; }
  .map-cell { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 6px; text-align: center; }
  .map-cell .nome { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: .85; }
  .map-cell .num { font-size: 18px; font-weight: 800; }
  .map-cell .val { font-size: 11px; opacity: .9; }

  .filtro-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #eadfc7; border-radius: 8px; padding: 10px; }
  .filtro-bar select, .filtro-bar input { font-size: 12px; padding: 6px 8px; border: 1px solid #d9cfb8; border-radius: 6px; }

  .reminder-item { border-left: 3px solid var(--yellow); padding-left: 10px; }

  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase
============================================================ */
const SUPABASE_URL = "https://wnnpmbgytuxyzonkmlyp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wlkj9arKt8rtySgbwEtIxw_ETQCi-Ta";

/* ============================================================
   CONFIGURAÇÃO — e-mail automático via EmailJS (emailjs.com)
============================================================ */
const EMAILJS_SERVICE_ID = "SEU_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "SEU_TEMPLATE_ID";
const EMAILJS_PUBLIC_KEY = "SUA_PUBLIC_KEY";
const EMAIL_GESTOR = "seuemail@exemplo.com";
const EMAIL_CONFIGURADO = EMAILJS_SERVICE_ID !== "SEU_SERVICE_ID" && EMAILJS_TEMPLATE_ID !== "SEU_TEMPLATE_ID" && EMAILJS_PUBLIC_KEY !== "SUA_PUBLIC_KEY";

/* Senha do painel do gestor — troque antes de divulgar o link */
const SENHA_GESTOR = "Nc@2026Suce$$o";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TIPOS_CLIENTE = ["Distribuidor", "Aplicador", "Revenda Lojista", "Construtora/Cliente Final"];
const FORMAS_PAGAMENTO = ["Pix", "Boleto 7 dias", "Boleto 21/42 dias", "Boleto 28 dias", "Cartão 1x", "Cartão 2x", "Cartão 3x", "Outro"];
const UF_LIST = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
const REGIAO_POR_UF = { AC:"Norte",AP:"Norte",AM:"Norte",PA:"Norte",RO:"Norte",RR:"Norte",TO:"Norte",
  AL:"Nordeste",BA:"Nordeste",CE:"Nordeste",MA:"Nordeste",PB:"Nordeste",PE:"Nordeste",PI:"Nordeste",RN:"Nordeste",SE:"Nordeste",
  DF:"Centro-Oeste",GO:"Centro-Oeste",MT:"Centro-Oeste",MS:"Centro-Oeste",
  ES:"Sudeste",MG:"Sudeste",RJ:"Sudeste",SP:"Sudeste",
  PR:"Sul",RS:"Sul",SC:"Sul" };
const REGIOES = ["Norte","Nordeste","Centro-Oeste","Sudeste","Sul"];
const REGIAO_COR = { "Norte":"#2F7A3A","Nordeste":"#D89A1F","Centro-Oeste":"#8A5A2B","Sudeste":"#14213D","Sul":"#1E3A6E" };

function fmt(v) { return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function hoje() { return new Date().toLocaleDateString("pt-BR"); }
function hojeISO() { return new Date().toISOString().slice(0,10); }
async function hashSenha(str) {
  try {
    if (window.crypto && window.crypto.subtle && window.isSecureContext) {
      const enc = new TextEncoder().encode("nc_salt_" + str);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { console.warn("Hash seguro indisponível, usando fallback (só para teste local)", e); }
  // Fallback simples — NÃO é criptografia de verdade. Só é usado quando o arquivo
  // é aberto direto (file://) em vez de servido via https (ex: já publicado na Vercel).
  var h = 0; for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return "fb_" + Math.abs(h).toString(16);
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

async function notificarGestor(tipoDocumento, doc) {
  if (!EMAIL_CONFIGURADO) return;
  const itensTexto = doc.itens.map(i => `${i.qtd}x ${i.nome} (${fmt(i.total)})`).join("\n");
  try {
    await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ service_id: EMAILJS_SERVICE_ID, template_id: EMAILJS_TEMPLATE_ID, user_id: EMAILJS_PUBLIC_KEY,
        template_params: { to_email: EMAIL_GESTOR, tipo_documento: tipoDocumento, representante: doc.repNome, cliente: doc.clienteNome, total: fmt(doc.total), data: doc.criadoEm, itens: itensTexto } })
    });
  } catch (e) { console.error("Falha ao enviar e-mail", e); }
}
function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Estado ---------------- */
var state = {
  booting: true,
  configOk: SUPABASE_URL !== "COLE_AQUI_A_PROJECT_URL" && SUPABASE_ANON_KEY !== "COLE_AQUI_A_ANON_KEY",
  products: [], carriers: [],
  session: null, isAdmin: false,
  tab: "clientes", modal: null, printDoc: null, draftQuote: null, pedidoDraft: null,
  loginMode: "login", loginErro: "",
  myClients: [], myQuotes: [], myOrders: [], myVisits: [],
  admin: { reps: [], clients: [], quotes: [], orders: [], carriers: [], aba: "dashboard", dashboardRepId: "",
    filtroProduto: "", filtroValorMin: "", filtroValorMax: "" }
};

function render() {
  var app = document.getElementById("app");
  if (!state.configOk) { app.innerHTML = '<div class="loading-wrap">Configuração pendente: preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.</div>'; return; }
  if (state.booting) { app.innerHTML = '<div class="loading-wrap">Carregando...</div>'; return; }
  if (state.printDoc) { app.innerHTML = renderPrint(state.printDoc); return; }
  if (state.isAdmin) { app.innerHTML = renderPainelGestor(); return; }
  if (!state.session) { app.innerHTML = renderLogin(); return; }
  app.innerHTML = renderShell();
}

async function boot() {
  if (!state.configOk) { render(); return; }
  const [{ data: products }, { data: carriers }] = await Promise.all([
    sb.from("products").select("*").order("id"),
    sb.from("carriers").select("*").order("nome"),
  ]);
  state.products = (products || []).map(p => ({ id: p.id, nome: p.nome, precos: p.precos }));
  state.carriers = carriers || [];
  state.booting = false;
  render();
}

/* ---------------- Login ---------------- */
function renderLogin() {
  var isLogin = state.loginMode === "login";
  var isGestor = state.loginMode === "gestor";
  return '' +
    '<div class="login-wrap"><div class="login-box">' +
      '<h1 class="login-title">NC</h1><p class="login-sub">Painel do Representante Comercial</p>' +
      '<div class="switcher">' +
        '<button class="' + (isLogin?"active":"") + '" onclick="setLoginMode(\'login\')">Entrar</button>' +
        '<button class="' + (state.loginMode==="cadastro"?"active":"") + '" onclick="setLoginMode(\'cadastro\')">Cadastrar</button>' +
        '<button class="' + (isGestor?"active":"") + '" onclick="setLoginMode(\'gestor\')">Gestor</button>' +
      '</div>' +
      (isGestor
        ? '<label class="campo"><span>Senha do painel de gestor</span><input type="password" class="input" id="senhaGestor"></label>' +
          (state.loginErro ? '<p class="erro">'+esc(state.loginErro)+'</p>' : '') +
          '<button class="btn btn-primary btn-block" onclick="entrarGestor()">Entrar no painel</button>'
        : (
          (state.loginMode==="cadastro" ? '<label class="campo"><span>Nome completo</span><input class="input" id="loginNome"></label>' : '') +
          '<label class="campo"><span>Usuário</span><input class="input" id="loginUsuario"></label>' +
          '<label class="campo"><span>Senha</span><input type="password" class="input" id="loginSenha"></label>' +
          (state.loginErro ? '<p class="erro">'+esc(state.loginErro)+'</p>' : '') +
          '<button class="btn btn-primary btn-block" onclick="' + (isLogin?"doLogin()":"doRegister()") + '">' + (isLogin?"Entrar":"Criar cadastro") + '</button>'
        )
      ) +
    '</div></div>';
}
function setLoginMode(m) { state.loginMode = m; state.loginErro = ""; render(); }

async function doLogin() {
  var usuario = document.getElementById("loginUsuario").value.trim();
  var senha = document.getElementById("loginSenha").value;
  var senhaHash = await hashSenha(senha);
  const { data, error } = await sb.from("reps").select("*").ilike("usuario", usuario).eq("senha", senhaHash).maybeSingle();
  if (error || !data) { state.loginErro = "Usuário ou senha inválidos."; render(); return; }
  state.session = { id: data.id, nome: data.nome, usuario: data.usuario };
  await entrarComoRep();
}
async function doRegister() {
  var nome = document.getElementById("loginNome").value.trim();
  var usuario = document.getElementById("loginUsuario").value.trim();
  var senha = document.getElementById("loginSenha").value;
  if (!nome || !usuario || !senha) { state.loginErro = "Preencha todos os campos."; render(); return; }
  const { data: existente } = await sb.from("reps").select("id").ilike("usuario", usuario).maybeSingle();
  if (existente) { state.loginErro = "Esse usuário já existe."; render(); return; }
  var senhaHash = await hashSenha(senha);
  const { data, error } = await sb.from("reps").insert({ nome, usuario, senha: senhaHash }).select().single();
  if (error) { state.loginErro = "Erro ao cadastrar: " + error.message; render(); return; }
  state.session = { id: data.id, nome: data.nome, usuario: data.usuario };
  await entrarComoRep();
}
async function entrarComoRep() {
  state.tab = "clientes"; state.booting = true; render();
  await carregarDadosDoRep();
  state.booting = false; render();
}
async function carregarDadosDoRep() {
  const rid = state.session.id;
  const [{ data: clients }, { data: quotes }, { data: orders }, { data: visits }] = await Promise.all([
    sb.from("clients").select("*").eq("rep_id", rid).order("criado_em"),
    sb.from("quotes").select("*").eq("rep_id", rid).order("criado_em"),
    sb.from("orders").select("*").eq("rep_id", rid).order("criado_em"),
    sb.from("visits").select("*").eq("rep_id", rid).order("data_followup"),
  ]);
  state.myClients = clients || [];
  state.myQuotes = (quotes || []).map(mapQuoteFromDb);
  state.myOrders = (orders || []).map(mapQuoteFromDb);
  state.myVisits = visits || [];
}
function mapQuoteFromDb(q) {
  return { id: q.id, repId: q.rep_id, repNome: q.rep_nome, clientId: q.client_id, clienteNome: q.cliente_nome, clienteTipo: q.cliente_tipo,
    itens: q.itens, subtotal: Number(q.subtotal != null ? q.subtotal : q.total), desconto: Number(q.desconto || 0), total: Number(q.total),
    formaPagamento: q.forma_pagamento, carrierNome: q.carrier_nome, observacoes: q.observacoes, status: q.status,
    criadoEm: q.criado_em ? new Date(q.criado_em).toLocaleDateString("pt-BR") : hoje() };
}
function doLogout() { state.session = null; render(); }

function entrarGestor() {
  var senha = document.getElementById("senhaGestor").value;
  if (senha !== SENHA_GESTOR) { state.loginErro = "Senha de gestor incorreta."; render(); return; }
  state.isAdmin = true;
  carregarDadosGestor().then(render);
}
async function carregarDadosGestor() {
  const [{ data: reps }, { data: clients }, { data: quotes }, { data: orders }, { data: carriers }] = await Promise.all([
    sb.from("reps").select("*").order("criado_em"),
    sb.from("clients").select("*").order("criado_em"),
    sb.from("quotes").select("*").order("criado_em"),

  ]);
  state.admin.reps = reps || [];
  state.admin.clients = clients || [];

}
function sairGestor() { state.isAdmin = false; render(); }

/* ---------------- Shell (representante) ---------------- */

function setTab(t) { state.tab = t; state.modal = null; render(); }

/* ---------------- Clientes ---------------- */
function renderClientes() {

    '<div class="list-item"><div><p class="titulo">'+esc(c.nome)+'</p><p class="sub">'+esc(c.tipo)+' · '+esc(c.cidade||"sem cidade")+(c.estado?"/"+esc(c.estado):"")+' · '+esc(c.telefone||"sem telefone")+'</p></div>' +

  ).join("");

}
function openClientModal(id) {
  var c = id ? state.myClients.find(x => x.id === id) : { id: null, nome:"", tipo: TIPOS_CLIENTE[0], telefone:"", email:"", documento:"", endereco:"", cep:"", cidade:"", estado:"" };
  state.modal = { type: "cliente", data: c };
  render();
}
async function excluirCliente(id) {
  var c = state.myClients.find(x => x.id === id);

  await sb.from("clients").delete().eq("id", id);
  state.myClients = state.myClients.filter(x => x.id !== id);
  render();
}
async function salvarCliente() {
  var d = state.modal.data;
  var nome = document.getElementById("cliNome").value.trim();
  if (!nome) return;
  var payload = {
    nome, tipo: document.getElementById("cliTipo").value,
    telefone: document.getElementById("cliTelefone").value.trim(),
    email: document.getElementById("cliEmail").value.trim(),
    documento: document.getElementById("cliDocumento").value.trim(),
    endereco: document.getElementById("cliEndereco").value.trim(),
    cep: document.getElementById("cliCep").value.trim(),
    cidade: document.getElementById("cliCidade").value.trim(),
    estado: document.getElementById("cliEstado").value,
  };
  if (d.id) {
    await sb.from("clients").update(payload).eq("id", d.id);
    state.myClients = state.myClients.map(x => x.id === d.id ? { ...x, ...payload } : x);
  } else {
    payload.rep_id = state.session.id;
    const { data } = await sb.from("clients").insert(payload).select().single();
    state.myClients.push(data);
  }
  state.modal = null; render();
}

/* ---------------- Orçamentos ---------------- */
function renderOrcamentos() {
  var clientes = state.myClients;
  var list = state.myQuotes.slice().reverse();
  var itemsHtml = list.length === 0 ? '<div class="empty">Nenhum orçamento criado ainda.</div>' : list.map(q =>
    '<div class="list-item"><div><p class="titulo">'+esc(q.clienteNome)+' <span style="color:#a89e93">· '+esc(q.criadoEm)+'</span></p>' +
    '<p class="sub">'+q.itens.length+' item(ns) · '+fmt(q.total)+(q.desconto?' (desconto '+q.desconto+'%)':'')+' · '+esc(q.formaPagamento||"sem forma de pagto")+'</p></div>' +
    '<div class="actions">' + badge(q.status) +
    '<select class="status-select" onchange="atualizarStatusOrcamento(\''+q.id+'\', this.value)">' +
      ["Rascunho","Enviado","Aprovado","Reprovado"].map(s=>'<option value="'+s+'" '+(s===q.status?"selected":"")+'>'+s+'</option>').join("") +
    '</select>' +
    '<button class="btn btn-ghost btn-sm" onclick="imprimirDoc(\'Orçamento\', \''+q.id+'\', \'myQuotes\')">Imprimir / PDF</button>' +
    (q.status==="Aprovado" ? '<button class="btn btn-yellow btn-sm" onclick="abrirGerarPedido(\''+q.id+'\')">Selecionar → Gerar pedido</button>' : '') +
    '</div></div>'
  ).join("");
  return '<div class="section-head"><h2>Orçamentos</h2><button class="btn btn-primary" '+(clientes.length===0?"disabled":"")+' onclick="abrirNovoOrcamento()">+ Novo orçamento</button></div>' +
    (clientes.length===0 ? '<p style="font-size:12px;color:#a89e93;margin-top:-8px">Cadastre um cliente antes de criar um orçamento.</p>' : '') +
    '<div class="card">'+itemsHtml+'</div>';
}
function badge(status) {
  var map = {"Rascunho":"badge-gray","Enviado":"badge-amber","Aprovado":"badge-green","Reprovado":"badge-red","Em aberto":"badge-amber","Faturado":"badge-blue","Entregue":"badge-green","Cancelado":"badge-red"};
  return '<span class="badge '+(map[status]||"badge-gray")+'">'+esc(status)+'</span>';
}
async function atualizarStatusOrcamento(id, status) {
  await sb.from("quotes").update({ status }).eq("id", id);
  state.myQuotes = state.myQuotes.map(q => q.id === id ? { ...q, status } : q);
  render();
}
function abrirNovoOrcamento() {
  if (state.myClients.length === 0) return;
  state.draftQuote = { clientId: state.myClients[0].id, itens: [], desconto: 0, formaPagamento: FORMAS_PAGAMENTO[0] };
  state.modal = { type: "orcamento" };
  render();
}
function draftCliente() { return state.myClients.find(c => c.id === state.draftQuote.clientId); }
function draftMudarCliente(id) { state.draftQuote.clientId = id; render(); }
function draftAdicionarItem() {
  var prodId = document.getElementById("orcProduto").value;
  var qtd = Number(document.getElementById("orcQtd").value) || 0;
  var cliente = draftCliente();
  var prod = state.products.find(p => p.id === prodId);
  if (!prod || !cliente || qtd <= 0) return;
  var preco = prod.precos[cliente.tipo];
  state.draftQuote.itens.push({ productId: prod.id, nome: prod.nome, qtd, precoUnit: preco, total: preco * qtd });
  render();
}
function draftRemoverItem(idx) { state.draftQuote.itens.splice(idx, 1); render(); }
function draftAtualizarDesconto(v) { state.draftQuote.desconto = Number(v) || 0; render(); }
function draftAtualizarPagamento(v) { state.draftQuote.formaPagamento = v; render(); }
function draftAtualizarPagamentoCustom(v) { state.draftQuote.formaPagamentoCustom = v; }
async function salvarOrcamento() {
  var cliente = draftCliente();
  var itens = state.draftQuote.itens;
  if (!cliente || itens.length === 0) return;
  var subtotal = itens.reduce((s,i)=>s+i.total,0);
  var desconto = state.draftQuote.desconto || 0;
  var total = subtotal * (1 - desconto/100);
  var formaPagamentoFinal = state.draftQuote.formaPagamento === "Outro" ? (state.draftQuote.formaPagamentoCustom || "Outro") : state.draftQuote.formaPagamento;
  var payload = { rep_id: state.session.id, rep_nome: state.session.nome, client_id: cliente.id, cliente_nome: cliente.nome, cliente_tipo: cliente.tipo,
    itens, subtotal, desconto, total, forma_pagamento: formaPagamentoFinal, status: "Rascunho" };
  const { data } = await sb.from("quotes").insert(payload).select().single();
  var novo = mapQuoteFromDb(data);
  state.myQuotes.push(novo);
  state.modal = null; state.draftQuote = null;
  render();
  notificarGestor("Orçamento", novo);
}

/* ---------------- Gerar pedido (seleciona forma de pagto + transportadora) ---------------- */
function abrirGerarPedido(quoteId) {
  var q = state.myQuotes.find(x => x.id === quoteId);
  if (!q) return;
  state.pedidoDraft = { quoteId, formaPagamento: q.formaPagamento || FORMAS_PAGAMENTO[0], carrierId: state.carriers[0]?.id || "" };
  state.modal = { type: "pedido" };
  render();
}
function renderModalPedido() {
  var q = state.myQuotes.find(x => x.id === state.pedidoDraft.quoteId);

  var transpHtml = state.carriers.length === 0 ? '<option value="">Nenhuma transportadora cadastrada</option>' :
    state.carriers.map(c => '<option value="'+c.id+'">'+esc(c.nome)+'</option>').join("");
  return '<div class="overlay"><div class="modal"><div class="modal-head"><h3>Gerar pedido — '+esc(q.clienteNome)+'</h3><button onclick="closeModal()">&times;</button></div>' +
    '<div class="modal-body">' +
      '<p class="total-line">Total do orçamento: <b>'+fmt(q.total)+'</b></p>' +
      '<label class="campo"><span>Forma de pagamento</span><select class="input" id="pedFormaPagamento" onchange="renderModalPedidoPagamento(this.value)">'+pagtoHtml+'</select></label>' +
      (state.pedidoDraft.formaPagamento === "Outro" ? '<label class="campo"><span>Descreva a forma de pagamento</span><input class="input" id="pedFormaPagamentoCustom" value="'+esc(state.pedidoDraft.formaPagamentoCustom||"")+'"></label>' : '') +
      '<label class="campo"><span>Transportadora</span><select class="input" id="pedTransportadora">'+transpHtml+'</select></label>' +
      '<label class="campo"><span>Observações</span><textarea class="input" id="pedObservacoes" rows="3">'+esc(state.pedidoDraft.observacoes||"")+'</textarea></label>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarGerarPedido()">Confirmar pedido</button></div>' +

}
function renderModalPedidoPagamento(v) { state.pedidoDraft.formaPagamento = v; render(); }
async function confirmarGerarPedido() {
  var q = state.myQuotes.find(x => x.id === state.pedidoDraft.quoteId);
  var formaPagamentoSel = document.getElementById("pedFormaPagamento").value;
  var formaPagamento = formaPagamentoSel === "Outro" ? (document.getElementById("pedFormaPagamentoCustom").value.trim() || "Outro") : formaPagamentoSel;
  var carrierId = document.getElementById("pedTransportadora").value;
  var carrier = state.carriers.find(c => c.id === carrierId);
  var observacoes = document.getElementById("pedObservacoes").value.trim();
  var payload = { rep_id: q.repId, rep_nome: q.repNome, client_id: q.clientId, cliente_nome: q.clienteNome, cliente_tipo: q.clienteTipo,
    quote_id: q.id, itens: q.itens, subtotal: q.subtotal, desconto: q.desconto, total: q.total,
    forma_pagamento: formaPagamento, carrier_id: carrierId || null, carrier_nome: carrier ? carrier.nome : null, observacoes, status: "Em aberto" };
  const { data } = await sb.from("orders").insert(payload).select().single();
  var pedido = mapQuoteFromDb(data);

function renderPedidos() {
  var list = state.myOrders.slice().reverse();

/* ---------------- Agenda de visitas ---------------- */
function renderAgenda() {
  var list = state.myVisits.slice().sort((a,b) => (a.data_followup||"").localeCompare(b.data_followup||""));
  var itemsHtml = list.length === 0 ? '<div class="empty">Nenhuma visita registrada ainda.</div>' : list.map(v => {

      '<div class="actions">'+tag+'<button class="btn btn-danger btn-sm" onclick="excluirVisita(\''+v.id+'\')">Excluir</button></div></div>';
  }).join("");

async function excluirVisita(id) {

function renderPainelGestor() {

function setAbaGestor(k) { state.admin.aba = k; render(); }
function nomeRepAdmin(id) { return (state.admin.reps.find(r => r.id === id) || {}).nome || "—"; }

/* ---- Dashboard ---- */
function renderDashboard() {
  var a = state.admin;
  var repId = a.dashboardRepId || "";
  var quotesF = repId ? a.quotes.filter(q => q.repId === repId) : a.quotes;
  var ordersF = repId ? a.orders.filter(o => o.repId === repId) : a.orders;
  var clientsF = repId ? a.clients.filter(c => c.rep_id === repId) : a.clients;

  var totalClientes = clientsF.length;
  var orcAberto = quotesF.filter(q => q.status === "Rascunho" || q.status === "Enviado").length;
  var taxaConversao = quotesF.length ? Math.round((ordersF.length / quotesF.length) * 100) : 0;
  var valorTotal = ordersF.reduce((s,o) => s + o.total, 0);
  var ticketMedio = ordersF.length ? valorTotal / ordersF.length : 0;

  var repsHtml = '<option value="">Todos os representantes</option>' + a.reps.map(r => '<option value="'+r.id+'" '+(r.id===repId?"selected":"")+'>'+esc(r.nome)+'</option>').join("");

  var kpis = '<div class="kpi-grid">' +
      '<div class="kpi-card"><p class="lbl">Total de clientes</p><p class="val">'+totalClientes+'</p></div>' +
      '<div class="kpi-card"><p class="lbl">Orçamentos em aberto</p><p class="val">'+orcAberto+'</p></div>' +
      '<div class="kpi-card"><p class="lbl">Taxa de conversão</p><p class="val">'+taxaConversao+'%</p></div>' +
      '<div class="kpi-card"><p class="lbl">Valor total vendido</p><p class="val">'+fmt(valorTotal)+'</p></div>' +
    '</div>';

  if (repId) {
    // Dashboard individual: KPIs extras + ticket médio + cidades que mais compram
    kpis += '<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)">' +
      '<div class="kpi-card"><p class="lbl">Número de pedidos</p><p class="val">'+ordersF.length+'</p></div>' +
      '<div class="kpi-card"><p class="lbl">Ticket médio</p><p class="val">'+fmt(ticketMedio)+'</p></div>' +
    '</div>';
    var porCidade = {};
    ordersF.forEach(o => {
      var cli = a.clients.find(c => c.id === o.clientId);
      var cidade = cli ? (cli.cidade || "Sem cidade") + (cli.estado ? "/"+cli.estado : "") : "Sem cidade";
      porCidade[cidade] = (porCidade[cidade] || 0) + o.total;
    });
    var listaCidades = Object.entries(porCidade).sort((a,b) => b[1]-a[1]).slice(0, 8);
    var cidadesHtml = listaCidades.length === 0 ? '<div class="empty">Sem pedidos ainda para esse representante.</div>' :
      listaCidades.map(([cidade, valor]) => '<div class="list-item"><p class="titulo">'+esc(cidade)+'</p><p class="sub">'+fmt(valor)+'</p></div>').join("");
    return '<div class="section-head"><h2>Dashboard — '+esc(nomeRepAdmin(repId))+'</h2><select class="input" style="max-width:280px" onchange="mudarDashboardRep(this.value)">'+repsHtml+'</select></div>' +
      kpis +
      '<h3 style="font-size:14px;color:#6b625a;margin-bottom:10px">Cidades que mais compram</h3>' +
      '<div class="card">'+cidadesHtml+'</div>';
  }

  var porRegiao = {}; REGIOES.forEach(r => porRegiao[r] = { clientes: 0, valor: 0 });
  a.clients.forEach(c => { var reg = REGIAO_POR_UF[c.estado]; if (reg) porRegiao[reg].clientes++; });
  a.orders.forEach(o => {
    var cli = a.clients.find(c => c.id === o.clientId);
    var reg = cli ? REGIAO_POR_UF[cli.estado] : null;
    if (reg) porRegiao[reg].valor += o.total;
  });
  var mapCells = {
    "Norte": "grid-column:1/3; grid-row:1/2;", "Nordeste": "grid-column:3/5; grid-row:1/2;",
    "Centro-Oeste": "grid-column:2/4; grid-row:2/3;", "Sudeste": "grid-column:3/5; grid-row:3/4;", "Sul": "grid-column:2/4; grid-row:4/5;",
  };
  var mapHtml = REGIOES.map(r => '<div class="map-cell" style="background:'+REGIAO_COR[r]+';'+mapCells[r]+'"><div class="nome">'+r+'</div><div class="num">'+porRegiao[r].clientes+' clientes</div><div class="val">'+fmt(porRegiao[r].valor)+'</div></div>').join("");

  return '<div class="section-head"><h2>Dashboard</h2><select class="input" style="max-width:280px" onchange="mudarDashboardRep(this.value)">'+repsHtml+'</select></div>' +
    kpis +
    '<h3 style="font-size:14px;color:#6b625a;margin-bottom:10px">Clientes e vendas por região</h3>' +
    '<div class="map-grid">'+mapHtml+'</div>';
}
function mudarDashboardRep(id) { state.admin.dashboardRepId = id; render(); }

function abrirEditarRepresentante(id) {
  var r = state.admin.reps.find(x => x.id === id);
  state.modal = { type: "editarRep", data: { ...r }, erro: "" };
  render();

async function salvarEdicaoRepresentante() {
  var d = state.modal.data;
  var payload = {
    endereco: document.getElementById("repEndereco").value.trim(),
    numero: document.getElementById("repNumero").value.trim(),
    bairro: document.getElementById("repBairro").value.trim(),
    cidade: document.getElementById("repCidade").value.trim(),
    estado: document.getElementById("repEstado").value,
    cep: document.getElementById("repCep").value.trim(),
    cpf: document.getElementById("repCpf").value.trim(),
  };
  var fileInput = document.getElementById("repFoto");
  if (fileInput && fileInput.files && fileInput.files[0]) {
    var file = fileInput.files[0];
    var path = "rep_" + d.id + "_" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");
    const { error: upErr } = await sb.storage.from("fotos").upload(path, file, { upsert: true });
    if (upErr) { state.modal.erro = "Erro ao enviar foto: " + upErr.message; render(); return; }
    const { data: urlData } = sb.storage.from("fotos").getPublicUrl(path);
    payload.foto_url = urlData.publicUrl;
  }
  await sb.from("reps").update(payload).eq("id", d.id);
  state.admin.reps = state.admin.reps.map(r => r.id === d.id ? { ...r, ...payload } : r);
  state.modal = null; render();
}
function abrirNovoRepresentante() { state.modal = { type: "representante", erro: "" }; render(); }
async function salvarNovoRepresentante() {
  var nome = document.getElementById("repNome").value.trim();
  var usuario = document.getElementById("repUsuario").value.trim();
  var senha = document.getElementById("repSenha").value;
  if (!nome || !usuario || !senha) { state.modal.erro = "Preencha todos os campos."; render(); return; }
  const { data: existente } = await sb.from("reps").select("id").ilike("usuario", usuario).maybeSingle();
  if (existente) { state.modal.erro = "Esse usuário já existe."; render(); return; }
  var senhaHash = await hashSenha(senha);
  const { data, error } = await sb.from("reps").insert({ nome, usuario, senha: senhaHash }).select().single();
  if (error) { state.modal.erro = "Erro: " + error.message; render(); return; }
  state.admin.reps.push(data);
  state.modal = null; render();
}
function exportarRepsCSV() { downloadCSV("representantes.csv", [["Nome","Usuário"], ...state.admin.reps.map(r=>[r.nome,r.usuario])]); }

async function salvarTransportadora() {

  var telefone = document.getElementById("transpTelefone").value.trim();

  function renderAbaComissionamento(){

    var repId = a.comissaoRepId || "";
    var repsHtml = '<option value="">Selecione um representante</option>' + a.reps.map(r => '<option value="'+r.id+'" '+(r.id===repId?"selected":"")+'>'+esc(r.nome)+'</option>').join("");

    if (!repId) {
      return '<div class="section-head"><h2>Comissionamento</h2></div>' +
        '<div class="card"><label class="campo"><span>Representante</span><select class="input" onchange="mudarComissaoRep(this.value)">'+repsHtml+'</select></label></div>';
    }

    var rep = a.reps.find(r => r.id === repId) || {};
    var comissaoPct = Number(rep.comissao_pct || 0);
    var pedidosElegiveis = a.orders.filter(o => o.repId === repId && o.status !== "Cancelado" && !o.comissaoFaturaId);
    var valorBase = pedidosElegiveis.reduce((s,o) => s + o.total, 0);
    var valorComissao = valorBase * comissaoPct / 100;

    var faturas = (a.comissoes || []).filter(c => c.rep_id === repId);

    var linhasPedidos = pedidosElegiveis.map(o =>
      '<div class="list-item"><div><p class="titulo">'+esc(o.clienteNome)+'</p><p class="sub">'+esc(o.criadoEm)+' · '+fmt(o.total)+'</p></div>' + badge(o.status) + '</div>'
    ).join("") || '<div class="empty">Nenhum pedido pendente de comissionamento.</div>';

    var linhasFaturas = faturas.map(f =>
      '<div class="list-item"><div><p class="titulo">Fechada em '+new Date(f.data_fechamento).toLocaleDateString("pt-BR")+' · '+fmt(f.valor_comissao)+'</p>' +
      '<p class="sub">NF: '+esc(f.nota_fiscal_numero||"—")+' · Vencimento: '+(f.data_vencimento_nota?new Date(f.data_vencimento_nota+"T00:00:00").toLocaleDateString("pt-BR"):"—")+'</p></div>' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" '+(f.nota_recebida?"checked":"")+' onchange="alternarNotaRecebida(\''+f.id+'\', this.checked)"> Nota recebida</label>' +
      '</div>'
    ).join("") || '<div class="empty">Nenhuma fatura fechada ainda.</div>';

    return '<div class="section-head"><h2>Comissionamento — '+esc(rep.nome)+'</h2>' +
      '<select class="input" style="max-width:280px" onchange="mudarComissaoRep(this.value)">'+repsHtml+'</select></div>' +

      '</div>' +
      '<h3 style="font-size:14px;color:#6b625a;margin-bottom:10px">Pedidos ainda não incluídos em fatura</h3>' +
      '<div class="card">'+linhasPedidos+'</div>' +

      '<h3 style="font-size:14px;color:#6b625a;margin:22px 0 10px">Faturas já fechadas</h3>' +
      '<div class="card">'+linhasFaturas+'</div>';
  }
  window.renderAbaComissionamento = renderAbaComissionamento;

  async function fecharFaturaComissao(repId){
    var a = state.admin;
    var rep = a.reps.find(r => r.id === repId);
    var pedidosElegiveis = a.orders.filter(o => o.repId === repId && o.status !== "Cancelado" && !o.comissaoFaturaId);
    if (pedidosElegiveis.length === 0) { alert("Nada pendente pra esse representante."); return; }
    var comissaoPct = Number(rep.comissao_pct || 0);
    var valorComissao = pedidosElegiveis.reduce((s,o) => s + o.total, 0) * comissaoPct / 100;

    var notaFiscalNumero = prompt("Número da nota fiscal do representante (opcional, pode deixar em branco por enquanto):") || "";
    var vencimentoStr = prompt("Data de vencimento da nota (AAAA-MM-DD, opcional):") || "";
    var vencimento = /^\d{4}-\d{2}-\d{2}$/.test(vencimentoStr) ? vencimentoStr : null;

    const { data: faturaData, error: erroFatura } = await sb.from("comissoes_representante").insert({
      rep_id: repId, rep_nome: rep.nome, valor_comissao: valorComissao,
      nota_fiscal_numero: notaFiscalNumero || null, data_vencimento_nota: vencimento,
    }).select().single();
    if (erroFatura) { alert("Erro ao fechar fatura: " + erroFatura.message); return; }

    const { data: contaPagarData, error: erroContaPagar } = await sb.from("contas_pagar").insert({
      fornecedor: rep.nome, descricao: "Comissão de representante — fechamento " + new Date().toLocaleDateString("pt-BR"),
      categoria: "Comissão de representante", grupo_dre: "Despesa Operacional",
      valor: valorComissao, vencimento: vencimento, forma_pagamento: null,
      confirmado: false, origem: "Comissão representante", lancado_por: "Sistema (Comissionamento)",
    }).select().single();
    if (!erroContaPagar && contaPagarData) {
      await sb.from("comissoes_representante").update({ contas_pagar_id: contaPagarData.id }).eq("id", faturaData.id);
    }

    for (var i=0; i<pedidosElegiveis.length; i++) {
      await sb.from("orders").update({ comissao_fatura_id: faturaData.id }).eq("id", pedidosElegiveis[i].id);
    }

    await carregarDadosGestor();
    render();
  }
  window.fecharFaturaComissao = fecharFaturaComissao;

  async function alternarNotaRecebida(faturaId, valor){
    await sb.from("comissoes_representante").update({ nota_recebida: valor }).eq("id", faturaId);
    state.admin.comissoes = state.admin.comissoes.map(f => f.id === faturaId ? { ...f, nota_recebida: valor } : f);
    render();
  }
  window.alternarNotaRecebida = alternarNotaRecebida;

})();

/* =========================================================
   EXTENSÃO 2 — Prazo de envio, tipo de contato na visita,
   Materiais NC, e correção do desconto máximo chegar pro representante

(function(){

  /* ---- Corrige: leva o desconto máximo pro state.session no login/cadastro ---- */
  doLogin = async function(){
    var usuario = document.getElementById("loginUsuario").value.trim();
    var senha = document.getElementById("loginSenha").value;
    var senhaHash = await hashSenha(senha);
    const { data, error } = await sb.from("reps").select("*").ilike("usuario", usuario).eq("senha", senhaHash).maybeSingle();
    if (error || !data) { state.loginErro = "Usuário ou senha inválidos."; render(); return; }
    state.session = { id: data.id, nome: data.nome, usuario: data.usuario, descontoMaximo: data.desconto_maximo || 0 };
    await entrarComoRep();
  };
  doRegister = async function(){
    var nome = document.getElementById("loginNome").value.trim();
    var usuario = document.getElementById("loginUsuario").value.trim();
    var senha = document.getElementById("loginSenha").value;
    if (!nome || !usuario || !senha) { state.loginErro = "Preencha todos os campos."; render(); return; }
    const { data: existente } = await sb.from("reps").select("id").ilike("usuario", usuario).maybeSingle();
    if (existente) { state.loginErro = "Esse usuário já existe."; render(); return; }
    var senhaHash = await hashSenha(senha);
    const { data, error } = await sb.from("reps").insert({ nome, usuario, senha: senhaHash }).select().single();
    if (error) { state.loginErro = "Erro ao cadastrar: " + error.message; render(); return; }
    state.session = { id: data.id, nome: data.nome, usuario: data.usuario, descontoMaximo: data.desconto_maximo || 0 };
    await entrarComoRep();
  };

  /* ---- Prazo de envio no pedido ---- */
  var renderModalPedidoOriginal = renderModalPedido;
  renderModalPedido = function(){
    var html = renderModalPedidoOriginal();
    var campoNovo = '<label class="campo"><span>Prazo de envio previsto</span><input type="date" class="input" id="pedPrazoEnvio" value="'+(state.pedidoDraft.prazoEnvio||"")+'"></label>';
    return html.replace('<label class="campo"><span>Observações</span>', campoNovo + '<label class="campo"><span>Observações</span>');
  };

  var confirmarGerarPedidoOriginal = confirmarGerarPedido;
  confirmarGerarPedido = async function(){
    var q = state.myQuotes.find(x => x.id === state.pedidoDraft.quoteId);
    var formaPagamentoSel = document.getElementById("pedFormaPagamento").value;
    var formaPagamento = formaPagamentoSel === "Outro" ? (document.getElementById("pedFormaPagamentoCustom").value.trim() || "Outro") : formaPagamentoSel;
    var carrierId = document.getElementById("pedTransportadora").value;
    var carrier = state.carriers.find(c => c.id === carrierId);
    var observacoes = document.getElementById("pedObservacoes").value.trim();
    var prazoEnvio = document.getElementById("pedPrazoEnvio").value || null;
    var payload = { rep_id: q.repId, rep_nome: q.repNome, client_id: q.clientId, cliente_nome: q.clienteNome, cliente_tipo: q.clienteTipo,
      quote_id: q.id, itens: q.itens, subtotal: q.subtotal, desconto: q.desconto, total: q.total,
      forma_pagamento: formaPagamento, carrier_id: carrierId || null, carrier_nome: carrier ? carrier.nome : null,
      observacoes, prazo_envio: prazoEnvio, status: "Em aberto" };
    const { data } = await sb.from("orders").insert(payload).select().single();
    var pedido = mapQuoteFromDb(data);
    pedido.carrierNome = carrier ? carrier.nome : null;
    pedido.prazoEnvio = prazoEnvio;
    state.myOrders.push(pedido);
    state.modal = null; state.pedidoDraft = null; state.tab = "pedidos";
    render();
    notificarGestor("Pedido", pedido);
  };

  var mapQuoteFromDbOriginal2 = mapQuoteFromDb;
  mapQuoteFromDb = function(q){
    var base = mapQuoteFromDbOriginal2(q);
    base.prazoEnvio = q.prazo_envio || null;
    return base;
  };

  var renderPedidosOriginal = renderPedidos;
  renderPedidos = function(){
    var list = state.myOrders.slice().reverse();
    var itemsHtml = list.length === 0 ? '<div class="empty">Nenhum pedido gerado ainda. Aprove um orçamento e clique em "Selecionar → Gerar pedido".</div>' : list.map(p =>
      '<div class="list-item"><div><p class="titulo">'+esc(p.clienteNome)+' <span style="color:#a89e93">· '+esc(p.criadoEm)+'</span></p>' +
      '<p class="sub">'+p.itens.length+' item(ns) · '+fmt(p.total)+' · '+esc(p.formaPagamento||"—")+(p.carrierNome?' · Transp.: '+esc(p.carrierNome):'')+(p.prazoEnvio?' · Envio previsto: '+fmtData(p.prazoEnvio):'')+'</p>' +
      (p.observacoes ? '<p class="sub">Obs.: '+esc(p.observacoes)+'</p>' : '') + '</div>' +
      '<div class="actions">' + badge(p.status) +
      '<select class="status-select" onchange="atualizarStatusPedido(\''+p.id+'\', this.value)">' +
        ["Em aberto","Faturado","Entregue","Cancelado"].map(s=>'<option value="'+s+'" '+(s===p.status?"selected":"")+'>'+s+'</option>').join("") +
      '</select>' +
      '<button class="btn btn-ghost btn-sm" onclick="imprimirDoc(\'Pedido\', \''+p.id+'\', \'myOrders\')">Imprimir / PDF</button>' +
      '</div></div>'
    ).join("");
    return '<div class="section-head"><h2>Pedidos</h2></div><div class="card">'+itemsHtml+'</div>';
  };

  var renderAgendaOriginal = renderAgenda;
  renderAgenda = function(){
    var list = state.myVisits.slice().sort((a,b) => (a.data_followup||"").localeCompare(b.data_followup||""));
    var itemsHtml = list.length === 0 ? '<div class="empty">Nenhuma visita registrada ainda.</div>' : list.map(v => {
      var atrasado = v.data_followup && v.data_followup < hojeISO();
      var hojeF = v.data_followup === hojeISO();
      var tag = atrasado ? '<span class="badge badge-red">Atrasado</span>' : hojeF ? '<span class="badge badge-amber">Hoje</span>' : '<span class="badge badge-gray">Agendado</span>';
      return '<div class="list-item reminder-item"><div><p class="titulo">'+esc(v.cliente_nome)+(v.tipo_contato?' · <span style="color:#a89e93">'+esc(v.tipo_contato)+'</span>':'')+'</p>' +
        '<p class="sub">Visita: '+fmtData(v.data_visita)+' · Próximo follow-up: '+fmtData(v.data_followup)+'</p>' +
        (v.observacoes ? '<p class="sub">'+esc(v.observacoes)+'</p>' : '') + '</div>' +
        '<div class="actions">'+tag+'<button class="btn btn-danger btn-sm" onclick="excluirVisita(\''+v.id+'\')">Excluir</button></div></div>';
    }).join("");
    return '<div class="section-head"><h2>Agenda de visitas</h2><button class="btn btn-primary" '+(state.myClients.length===0?"disabled":"")+' onclick="abrirNovaVisita()">+ Nova visita</button></div>' +
      (state.myClients.length===0 ? '<p style="font-size:12px;color:#a89e93;margin-top:-8px">Cadastre um cliente antes de agendar uma visita.</p>' : '') +
      '<div class="card">'+itemsHtml+'</div>';
  };

  /* ---- Tipo de contato na visita (Presencial / Telefone) ---- */
  var renderModalVisitaOriginal = renderModalVisita;
  renderModalVisita = function(){
    var d = state.modal.data;
    var clientesHtml = state.myClients.map(c => '<option value="'+c.id+'" '+(c.id===d.clientId?"selected":"")+'>'+esc(c.nome)+'</option>').join("");
    var tiposContato = ["Presencial","Telefone"];
    var tipoContatoHtml = tiposContato.map(t => '<option value="'+t+'" '+(t===d.tipoContato?"selected":"")+'>'+t+'</option>').join("");
    return '<div class="overlay"><div class="modal"><div class="modal-head"><h3>Nova visita</h3><button onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<label class="campo"><span>Cliente *</span><select class="input" id="visCliente">'+clientesHtml+'</select></label>' +
        '<label class="campo"><span>Tipo de contato</span><select class="input" id="visTipoContato">'+tipoContatoHtml+'</select></label>' +
        '<div class="row2">' +
          '<label class="campo"><span>Data da visita</span><input type="date" class="input" id="visDataVisita" value="'+d.dataVisita+'"></label>' +
          '<label class="campo"><span>Próximo follow-up</span><input type="date" class="input" id="visDataFollowup" value="'+d.dataFollowup+'"></label>' +
        '</div>' +
        '<label class="campo"><span>Observações</span><textarea class="input" id="visObs" rows="3">'+esc(d.observacoes)+'</textarea></label>' +
        '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarVisita()">Salvar</button></div>' +
      '</div></div></div>';
  };

  var abrirNovaVisitaOriginal = abrirNovaVisita;
  abrirNovaVisita = function(){
    state.modal = { type: "visita", data: { clientId: state.myClients[0]?.id, dataVisita: hojeISO(), dataFollowup: hojeISO(), observacoes: "", tipoContato: "Presencial" } };
    render();
  };

  var salvarVisitaOriginal = salvarVisita;
  salvarVisita = async function(){
    var clientId = document.getElementById("visCliente").value;
    var cliente = state.myClients.find(c => c.id === clientId);
    var payload = { rep_id: state.session.id, client_id: clientId, cliente_nome: cliente ? cliente.nome : "",
      data_visita: document.getElementById("visDataVisita").value, data_followup: document.getElementById("visDataFollowup").value,
      tipo_contato: document.getElementById("visTipoContato").value,
      observacoes: document.getElementById("visObs").value.trim() };
    const { data } = await sb.from("visits").insert(payload).select().single();
    state.myVisits.push(data);
    state.modal = null; render();
  };

  /* ---- Aba "Materiais NC" (biblioteca de mídias) pro representante ---- */
  var TIPOS_MATERIAL = ["Vídeo","Manual","Desenho técnico","Foto","Outro"];

  var renderShellOriginal = renderShell;
  renderShell = function(){
    var tabsHtml = [["clientes","Clientes"],["orcamentos","Orçamentos"],["pedidos","Pedidos"],["agenda","Agenda"],["materiais","Materiais NC"]].map(t =>
      '<button class="tab ' + (state.tab===t[0]?"active":"") + '" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'
    ).join("");
    var body = state.tab === "clientes" ? renderClientes() : state.tab === "orcamentos" ? renderOrcamentos() :
      state.tab === "pedidos" ? renderPedidos() : state.tab === "materiais" ? renderMateriaisNC() : renderAgenda();
    var pendentes = state.myVisits.filter(v => v.data_followup && v.data_followup <= hojeISO());
    var banner = pendentes.length > 0 ? '<div class="banner-alert no-print">Você tem ' + pendentes.length + ' follow-up(s) vencendo hoje ou atrasado(s). Veja a aba Agenda.</div>' : '';
    return '' +
      '<div class="header no-print"><div><h1>NC · Painel do Representante</h1><p>' + esc(state.session.nome) + '</p></div><button class="btn btn-secondary" onclick="doLogout()">Sair</button></div>' +
      banner +
      '<div class="tabs no-print">' + tabsHtml + '</div>' +
      '<main>' + body + '</main>' +
      (!EMAIL_CONFIGURADO ? '<p class="banner-config no-print">Notificação por e-mail ainda não configurada (EmailJS pendente).</p>' : '') +
      (state.modal ? renderModal() : '');
  };

  state.materiaisNC = state.materiaisNC || [];

  var carregarDadosDoRepOriginal = carregarDadosDoRep;
  carregarDadosDoRep = async function(){
    await carregarDadosDoRepOriginal();
    const { data: materiais } = await sb.from("materiais_nc").select("*").order("categoria").order("titulo");
    state.materiaisNC = materiais || [];
  };

  function renderMateriaisNC(){
    var porCategoria = {};
    state.materiaisNC.forEach(function(m){
      var cat = m.categoria || "Geral";
      if (!porCategoria[cat]) porCategoria[cat] = [];
      porCategoria[cat].push(m);
    });
    var categorias = Object.keys(porCategoria).sort();
    if (categorias.length === 0) return '<div class="section-head"><h2>Materiais NC</h2></div><div class="empty">Nenhum material disponível ainda.</div>';

    var html = '<div class="section-head"><h2>Materiais NC</h2></div>';
    categorias.forEach(function(cat){
      var itens = porCategoria[cat].map(function(m){
        return '<div class="list-item"><div><p class="titulo">'+esc(m.titulo)+'</p><p class="sub">'+esc(m.tipo||"")+(m.descricao?' · '+esc(m.descricao):"")+'</p></div>' +
          '<a class="btn btn-yellow btn-sm" href="'+esc(m.url)+'" target="_blank" rel="noopener">Abrir</a></div>';
      }).join("");
      html += '<h3 style="font-size:14px;color:#6b625a;margin:18px 0 10px">'+esc(cat)+'</h3><div class="card">'+itens+'</div>';
    });
    return html;
  }
  window.renderMateriaisNC = renderMateriaisNC;

  /* ---- Gestão de Materiais NC (aba nova no painel do gestor) ---- */
  renderPainelGestor = function(){
    var a = state.admin;
    var tabsHtml = [["dashboard","Dashboard"],["representantes","Representantes"],["clientes","Clientes"],["orcamentos","Orçamentos"],["pedidos","Pedidos"],["comissionamento","Comissionamento"],["materiais","Materiais NC"],["precos","Preços"],["transportadoras","Transportadoras"]].map(t =>
      '<button class="tab ' + (a.aba===t[0]?"active":"") + '" onclick="setAbaGestor(\''+t[0]+'\')">'+t[1]+'</button>'
    ).join("");
    var body =
      a.aba === "dashboard" ? renderDashboard() :
      a.aba === "representantes" ? renderAbaReps() :
      a.aba === "clientes" ? renderAbaClientesGestor() :
      a.aba === "orcamentos" ? renderAbaOrcamentosGestor() :
      a.aba === "pedidos" ? renderAbaPedidosGestor() :
      a.aba === "comissionamento" ? renderAbaComissionamento() :
      a.aba === "materiais" ? renderAbaMateriaisGestor() :
      a.aba === "precos" ? renderAbaPrecos() : renderAbaTransportadoras();
    return '<div class="header gestor no-print"><div><h1>NC · Painel do Gestor</h1><p>'+a.reps.length+' representante(s) cadastrado(s)</p></div><button class="btn btn-secondary" onclick="sairGestor()">Sair</button></div>' +
      '<div class="tabs no-print">'+tabsHtml+'</div><main>'+body+'</main>' +
      (state.modal ? renderModal() : '');
  };

  var carregarDadosGestorOriginal2 = carregarDadosGestor;
  carregarDadosGestor = async function(){
    await carregarDadosGestorOriginal2();
    const { data: materiais } = await sb.from("materiais_nc").select("*").order("categoria").order("titulo");
    state.admin.materiais = materiais || [];
  };

  function renderAbaMateriaisGestor(){
    var lista = state.admin.materiais || [];
    var linhas = lista.map(function(m){
      return '<div class="list-item"><div><p class="titulo">'+esc(m.titulo)+'</p><p class="sub">'+esc(m.categoria||"Geral")+' · '+esc(m.tipo||"")+'</p></div>' +
        '<div class="actions"><a class="btn btn-ghost btn-sm" href="'+esc(m.url)+'" target="_blank">Ver link</a>' +
        '<button class="btn btn-secondary btn-sm" onclick="excluirMaterialNC(\''+m.id+'\')">Excluir</button></div></div>';
    }).join("") || '<div class="empty">Nenhum material cadastrado ainda.</div>';
    var tiposHtml = TIPOS_MATERIAL.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join("");
    return '<div class="section-head"><h2>Materiais NC</h2></div>' +
      '<div class="card" style="margin-bottom:16px;">' +
        '<label class="campo"><span>Categoria</span><input class="input" id="matCategoria" placeholder="Ex: Flanges, Institucional, Vídeos institucionais"></label>' +
        '<label class="campo"><span>Título</span><input class="input" id="matTitulo"></label>' +
        '<label class="campo"><span>Tipo</span><select class="input" id="matTipo">'+tiposHtml+'</select></label>' +
        '<label class="campo"><span>Link (YouTube, PDF, etc.)</span><input class="input" id="matUrl" placeholder="https://..."></label>' +
        '<label class="campo"><span>Descrição (opcional)</span><input class="input" id="matDescricao"></label>' +
        '<button class="btn btn-primary" style="margin-top:8px;" onclick="salvarMaterialNC()">Adicionar material</button>' +
      '</div>' +
      '<div class="card">'+linhas+'</div>';
  }
  window.renderAbaMateriaisGestor = renderAbaMateriaisGestor;

  async function salvarMaterialNC(){
    var categoria = document.getElementById("matCategoria").value.trim() || "Geral";
    var titulo = document.getElementById("matTitulo").value.trim();
    var tipo = document.getElementById("matTipo").value;
    var url = document.getElementById("matUrl").value.trim();
    var descricao = document.getElementById("matDescricao").value.trim();
    if (!titulo || !url) { alert("Preencha pelo menos título e link."); return; }
    const { data, error } = await sb.from("materiais_nc").insert({ categoria, titulo, tipo, url, descricao }).select().single();
    if (error) { alert("Erro: " + error.message); return; }
    state.admin.materiais.push(data);
    render();
  }
  window.salvarMaterialNC = salvarMaterialNC;

  async function excluirMaterialNC(id){
    if (!confirm("Excluir esse material?")) return;
    await sb.from("materiais_nc").delete().eq("id", id);
    state.admin.materiais = state.admin.materiais.filter(function(m){ return m.id !== id; });
    render();
  }
  window.excluirMaterialNC = excluirMaterialNC;

})();

/* ---------------- Boot ---------------- */
boot();
</script>
</body>
</html>
