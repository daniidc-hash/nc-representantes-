<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC | Planejamento Estratégico</title>

<style>
  :root{
    --navy:#152238;
    --navy-2:#1e3050;
    --cream:#F5EFE4;
    --cream-2:#EDE4D3;
    --bordeaux:#7A2E3A;
    --bordeaux-2:#5E212B;
    --gold:#C9A227;
    --ink:#2B2420;
    --muted:#8A8072;
    --danger:#B23A3A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Times New Roman', serif;
    background:var(--navy);
    color:var(--ink);
    min-height:100vh;
  }
  /* ---------- LOGIN ---------- */
  #tela-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 30% 20%, var(--navy-2), var(--navy) 70%);
  }
  .caixa-login{
    background:var(--cream);
    padding:44px 36px;
    border-radius:6px;
    width:100%;
    max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    text-align:center;
  }
  .marca-nc{
    display:inline-block;
    background:var(--bordeaux);
    color:var(--cream);
    font-weight:bold;
    letter-spacing:2px;
    padding:6px 18px;
    border-radius:4px;
    font-size:14px;
    margin-bottom:18px;
  }
  .caixa-login h1{
    font-size:20px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .caixa-login p.sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 24px;
  }
  input[type="password"], input[type="text"], textarea{
    width:100%;
    font-family:'Georgia', serif;
    padding:11px 12px;
    border:1px solid #D8CDB8;
    border-radius:4px;
    background:#fff;
    color:var(--ink);
    font-size:14px;
  }
  textarea{resize:vertical; min-height:90px; line-height:1.5;}
  .btn{
    display:inline-block;
    background:var(--bordeaux);
    color:var(--cream);
    border:none;
    padding:11px 20px;
    border-radius:4px;
    font-family:'Georgia', serif;
    font-size:14px;
    letter-spacing:0.4px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--bordeaux-2);}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-gold:hover{background:#B8931F;}
  .btn-ghost{background:transparent; color:var(--bordeaux); border:1px solid var(--bordeaux);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{background:#8E2C2C;}
  #login-erro{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}
  #tela-login .btn{width:100%; margin-top:16px;}

  /* ---------- APP LAYOUT ---------- */
  #app{display:none;}
  header.topo{
    background:var(--navy);
    color:var(--cream);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--gold);
    position:sticky; top:0; z-index:20;
  }
  header.topo .titulo{display:flex; align-items:center; gap:12px;}
  header.topo .titulo h1{font-size:18px; margin:0; font-weight:normal; letter-spacing:.3px;}
  header.topo .voltar{color:var(--cream); text-decoration:none; font-size:13px; border:1px solid rgba(245,239,228,.4); padding:6px 12px; border-radius:4px;}
  header.topo .voltar:hover{background:rgba(245,239,228,.1);}
  #status-save{font-size:12px; color:var(--cream); opacity:.75;}

  .layout{display:flex; min-height:calc(100vh - 60px);}
  nav.sidebar{
    width:250px;
    background:var(--cream-2);
    padding:18px 0;
    flex-shrink:0;
    border-right:1px solid #DED2B8;
  }
  nav.sidebar .grupo-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    padding:14px 20px 6px;
  }
  nav.sidebar button.item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:10px 20px;
    font-family:'Georgia', serif;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    border-left:3px solid transparent;
  }
  nav.sidebar button.item:hover{background:#E4D9C1;}
  nav.sidebar button.item.ativo{
    background:#fff;
    border-left:3px solid var(--bordeaux);
    color:var(--bordeaux);
    font-weight:bold;
  }

  main.conteudo{flex:1; padding:28px 32px; background:#FBF8F2; overflow-x:auto;}
  .secao{display:none;}
  .secao.ativa{display:block; max-width:920px;}
  .secao h2{
    font-size:24px;
    margin:0 0 4px;
    color:var(--navy);
  }
  .secao .desc{color:var(--muted); font-size:14px; margin:0 0 26px; line-height:1.5;}

  .campo{margin-bottom:22px;}
  .campo label{
    display:block;
    font-weight:bold;
    font-size:14px;
    color:var(--navy);
    margin-bottom:6px;

  .campo .ajuda{font-size:12.5px; color:var(--muted); margin:2px 0 8px; font-style:italic;}

    background:#fff;
    border:1px solid #E7DFCC;
    border-radius:6px;
    padding:20px;
    margin-bottom:20px;
  }
  .cartao h3{margin:0 0 4px; font-size:16px; color:var(--bordeaux);}

  /* tabela dinâmica */
  table.dyn{width:100%; border-collapse:collapse; margin-top:6px;}
  table.dyn th{
    text-align:left; font-size:12.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.4px; padding:6px 8px; border-bottom:2px solid #E7DFCC;
  }
  table.dyn td{padding:6px 8px; border-bottom:1px solid #F0EAD9; vertical-align:top;}
  table.dyn td input, table.dyn td textarea{font-size:13px; padding:7px 9px;}
  table.dyn td.acao{width:36px; text-align:center;}
  .link-remover{color:var(--danger); cursor:pointer; font-size:18px; line-height:1;}
  .rodape-tabela{margin-top:10px;}

    display:flex; gap:10px; align-items:center; margin-top:24px;
    padding-top:16px; border-top:1px solid #E7DFCC;
  }
  .msg-secao{font-size:13px; color:#4C7A4C; opacity:0; transition:opacity .2s;}
  .msg-secao.ver{opacity:1;}

    .layout{flex-direction:column;}
    nav.sidebar{width:100%; display:flex; overflow-x:auto; padding:8px;}
    nav.sidebar .grupo-label{display:none;}

    nav.sidebar button.item.ativo{border-left:none; border-bottom:3px solid var(--bordeaux);}
    .grid-2{grid-template-columns:1fr;}
    main.conteudo{padding:20px 16px;}

   CONFIGURAÇÃO SUPABASE
   Copie as mesmas duas linhas que já estão no seu index.html

========================================================= */
const SUPABASE_URL = "https://wnnpmbgytuxyzonkmlyp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wlkj9arKt8rtySgbwEtIxw_ETQCi-Ta";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  gestora:        { sistema:true,  financeiro:true,  planejamento:true },
  financeiro:     { sistema:false, financeiro:true,  planejamento:false },
  vendedor:       { sistema:true,  financeiro:false, planejamento:false },
  representante:  { sistema:true,  financeiro:false, planejamento:false },
};

async function checarAcessoEIniciar(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){
    window.location.href = 'hub.html';
    return;
  }
  const { data: perfil, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !perfil){
    document.getElementById('login-erro').textContent = 'Não encontramos seu perfil. Fale com a gestão.';
    return;
  }
  const permissoes = PERMISSOES_POR_ROLE[perfil.role] || {};
  if(!permissoes.planejamento){
    document.getElementById('login-erro').textContent = 'Seu perfil não tem acesso ao Planejamento.';
    return;
  }
  iniciarApp();
}

async function sairDoModulo(){
  await supabase.auth.signOut();
  window.location.href = 'hub.html';
}

/* =========================================================
   ESTADO
========================================================= */
let estado = {};   // { secaoId: {campoKey: valor ou [linhas]} }
let secaoAtiva = SECOES[0].id;

async function iniciarApp(){
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  montarSidebar();
  await carregarDados();
  renderSecao(secaoAtiva);
}

/* checa sessão ao carregar */
window.addEventListener('DOMContentLoaded', checarAcessoEIniciar);

function montarSidebar(){
  const nav = document.getElementById('nav-sidebar');
  nav.innerHTML = '';
  let grupoAtual = null;
  SECOES.forEach(sec=>{
    if(sec.grupo !== grupoAtual){
      grupoAtual = sec.grupo;
      const label = document.createElement('div');
      label.className = 'grupo-label';
      label.textContent = grupoAtual;
      nav.appendChild(label);
    }
    const btn = document.createElement('button');
    btn.className = 'item' + (sec.id === secaoAtiva ? ' ativo' : '');
    btn.textContent = sec.titulo;
    btn.onclick = ()=>{ secaoAtiva = sec.id; montarSidebar(); renderSecao(sec.id); };
    nav.appendChild(btn);
  });
}

/* =========================================================
   CARREGAR / SALVAR NO SUPABASE
========================================================= */
async function carregarDados(){
  document.getElementById('status-save').textContent = 'Carregando...';
  const { data, error } = await supabase.from('planejamento').select('secao, dados');
  if(error){
    console.error(error);
    document.getElementById('status-save').textContent = 'Erro ao carregar';
    return;
  }
  estado = {};
  (data || []).forEach(row=>{ estado[row.secao] = row.dados || {}; });
  document.getElementById('status-save').textContent = 'Dados carregados';
}

async function salvarSecao(secaoId){
  const botao = document.getElementById('msg-' + secaoId);
  const { error } = await supabase.from('planejamento').upsert({
    secao: secaoId,
    dados: estado[secaoId] || {},
    atualizado_em: new Date().toISOString()
  }, { onConflict: 'secao' });

  if(error){
    console.error(error);
    if(botao){ botao.textContent = 'Erro ao salvar'; botao.style.color = '#B23A3A'; botao.classList.add('ver'); }
    return;
  }
  if(botao){
    botao.textContent = 'Salvo ✓';
    botao.style.color = '#4C7A4C';
    botao.classList.add('ver');
    setTimeout(()=> botao.classList.remove('ver'), 2000);
  }
  document.getElementById('status-save').textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR');
}

/* =========================================================
   RENDER DE SEÇÃO
========================================================= */
function renderSecao(id){
  const sec = SECOES.find(s=>s.id === id);
  const cont = document.getElementById('conteudo');
  if(!estado[id]) estado[id] = {};

  let html = `<div class="secao ativa"><h2>${sec.titulo}</h2><p class="desc">${sec.desc}</p>`;

  sec.campos.forEach(campo=>{
    if(campo.tipo === 'tabela'){
      html += renderTabela(id, campo);
    } else {
      html += renderCampoSimples(id, campo);
    }
  });

  html += `
    <div class="barra-acoes">
      <button class="btn" onclick="salvarSecao('${id}')">Salvar</button>
      <span class="msg-secao" id="msg-${id}"></span>
    </div>
  </div>`;

  cont.innerHTML = html;
  ativarBindings(id, sec);
}

function renderCampoSimples(secId, campo){
  const valorAtual = (estado[secId][campo.key] || '');
  if(campo.tipo === 'select'){
    const opcoes = campo.opcoes.map(o=>`<option value="${o}" ${o===valorAtual?'selected':''}>${o}</option>`).join('');
    return `<div class="campo">
      <label>${campo.label}</label>
      ${campo.ajuda ? `<div class="ajuda">${campo.ajuda}</div>` : ''}
      <select data-secao="${secId}" data-campo="${campo.key}" onchange="atualizarCampo(this)">${opcoes}</select>
    </div>`;
  }
  if(campo.tipo === 'input'){
    return `<div class="campo">
      <label>${campo.label}</label>
      ${campo.ajuda ? `<div class="ajuda">${campo.ajuda}</div>` : ''}
      <input type="text" data-secao="${secId}" data-campo="${campo.key}" value="${escapeAttr(valorAtual)}" oninput="atualizarCampo(this)">
    </div>`;
  }
  // textarea (default: texto)
  return `<div class="campo">
    <label>${campo.label}</label>
    ${campo.ajuda ? `<div class="ajuda">${campo.ajuda}</div>` : ''}
    <textarea data-secao="${secId}" data-campo="${campo.key}" oninput="atualizarCampo(this)">${escapeHtml(valorAtual)}</textarea>
  </div>`;
}

function renderTabela(secId, campo){
  const linhas = estado[secId][campo.key] || [];
  let cabecalho = campo.colunas.map(c=>`<th>${c.label}</th>`).join('') + '<th></th>';
  let corpo = linhas.map((linha, idx)=> linhaTabelaHtml(secId, campo, linha, idx)).join('');

  return `<div class="cartao">
    <h3>${campo.label}</h3>
    ${campo.ajuda ? `<div class="ajuda">${campo.ajuda}</div>` : ''}
    <table class="dyn" id="tabela-${secId}-${campo.key}">
      <thead><tr>${cabecalho}</tr></thead>
      <tbody>${corpo}</tbody>
    </table>
    <div class="rodape-tabela">
      <button class="btn btn-ghost" onclick="adicionarLinha('${secId}','${campo.key}')">+ Adicionar linha</button>
    </div>
  </div>`;
}

function linhaTabelaHtml(secId, campo, linha, idx){
  const celulas = campo.colunas.map(col=>{
    const val = linha[col.key] || '';
    if(col.tipo === 'select'){
      const opcoes = col.opcoes.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('');
      return `<td><select data-linha="${idx}" data-col="${col.key}" onchange="atualizarCelula('${secId}','${campo.key}', this)">${opcoes}</select></td>`;
    }
    if(col.tipo === 'textarea'){
      return `<td><textarea data-linha="${idx}" data-col="${col.key}" oninput="atualizarCelula('${secId}','${campo.key}', this)">${escapeHtml(val)}</textarea></td>`;
    }
    return `<td><input type="text" data-linha="${idx}" data-col="${col.key}" value="${escapeAttr(val)}" oninput="atualizarCelula('${secId}','${campo.key}', this)"></td>`;
  }).join('');
  return `<tr>${celulas}<td class="acao"><span class="link-remover" onclick="removerLinha('${secId}','${campo.key}', ${idx})" title="Remover linha">✕</span></td></tr>`;
}

function ativarBindings(){ /* reservado para extensões futuras */ }

/* =========================================================
   MUTAÇÕES DE ESTADO
========================================================= */
function atualizarCampo(el){
  const secId = el.dataset.secao;
  const key = el.dataset.campo;
  estado[secId][key] = el.value;
}

function atualizarCelula(secId, campoKey, el){
  const idx = parseInt(el.dataset.linha, 10);
  const col = el.dataset.col;
  if(!estado[secId][campoKey]) estado[secId][campoKey] = [];
  if(!estado[secId][campoKey][idx]) estado[secId][campoKey][idx] = {};
  estado[secId][campoKey][idx][col] = el.value;
}

function adicionarLinha(secId, campoKey){
  if(!estado[secId][campoKey]) estado[secId][campoKey] = [];
  estado[secId][campoKey].push({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()) });
  renderSecao(secId);
}

function removerLinha(secId, campoKey, idx){
  estado[secId][campoKey].splice(idx, 1);
  renderSecao(secId);
}

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
</script>
